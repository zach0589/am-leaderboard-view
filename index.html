<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />

<body>
<title>HubSpot AM Score</title>
<style id="gate-style">
  :root {
    color-scheme: light;
    --plane: #F1F4F8; --surface: #FFFFFF; --navy: #1D3A6C; --navy-deep: #14294D;
    --sky: #299CD7; --ink: #101A29; --ink-2: #56657A; --ink-3: #8492A4;
    --hairline: #DEE4EC; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0B1017; --surface: #141A24; --navy: #172D53; --navy-deep: #101F3B;
    --ink: #EEF2F7; --ink-2: #A2B0C2; --ink-3: #78869A; --hairline: #26303D;
  } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--plane); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
  #gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  #gate .card { background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 30px 32px; width: min(430px, 100%);
    box-shadow: 0 1px 2px rgba(16,26,41,.06), 0 18px 40px -14px rgba(16,26,41,.22); }
  #gate .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--sky); margin-bottom: 6px; }
  #gate h1 { margin: 0 0 6px; font-size: 22px; font-weight: 750; letter-spacing: -0.02em; }
  #gate p.sub { margin: 0 0 20px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  #gate label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  #gate input { width: 100%; font: inherit; font-size: 15px; padding: 11px 13px;
    border: 1px solid var(--hairline); border-radius: 7px; background: var(--plane);
    color: var(--ink); }
  #gate input:focus-visible { outline: 2px solid var(--sky); outline-offset: 1px; }
  #gate button { width: 100%; margin-top: 14px; font: inherit; font-size: 14px; font-weight: 700;
    padding: 12px; border: 0; border-radius: 7px; cursor: pointer;
    background: var(--navy); color: #fff; }
  #gate button:hover { background: var(--navy-deep); }
  #gate button:disabled { opacity: .6; cursor: default; }
  #gate .msg { margin-top: 14px; font-size: 13px; min-height: 20px; }
  #gate .msg.err { color: var(--critical); font-weight: 600; }
  #gate .msg.busy { color: var(--ink-2); }
  #gate .foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--hairline);
    font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
</style>
<div id="gate">
  <form class="card" id="form">
    <div class="eyebrow">Account Management Standings</div>
    <h1>HubSpot AM Score</h1>
    <p class="sub">This page holds client and performance data, so it is encrypted.
      Enter the passphrase to view it.</p>
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus
           placeholder="word-word-word-word-word" />
    <button id="go" type="submit">View dashboard</button>
    <div class="msg" id="msg"></div>
    <div class="foot">Decryption happens in your browser. Nothing is sent anywhere,
      and the data stays unreadable to anyone without the passphrase.</div>
  </form>
</div>

set</button>\n    <button class=\"ghost-btn\" id=\"themeBtn\" type=\"button\" aria-label=\"Toggle theme\">Theme</button>\n  </div>\n</div>\n\n<div class=\"wrap\">\n  <div class=\"tabs\" role=\"tablist\" id=\"tabs\"></div>\n\n  <section class=\"panel on\" id=\"p-standings\" role=\"tabpanel\"></section>\n  <section class=\"panel\" id=\"p-coverage\" role=\"tabpanel\"></section>\n  <section class=\"panel\" id=\"p-hygiene\" role=\"tabpanel\"></section>\n  <section class=\"panel\" id=\"p-engagement\" role=\"tabpanel\"></section>\n  <section class=\"panel\" id=\"p-alerts\" role=\"tabpanel\"></section>\n  <section class=\"panel\" id=\"p-recognition\" role=\"tabpanel\"></section>\n  <section class=\"panel\" id=\"p-annual\" role=\"tabpanel\"></section>\n</div>\n\n<div class=\"scrim\" id=\"scrim\"></div>\n<aside class=\"drawer\" id=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawerName\">\n  <div class=\"drawer-head\">\n    <h2 id=\"drawerName\"></h2>\n    <div class=\"sub\" id=\"drawerSub\"></div>\n    <button class=\"drawer-close\" id=\"drawerClose\" type=\"button\">Close</button>\n  </div>\n  <div class=\"drawer-body\" id=\"drawerBody\"></div>\n</aside>\n\n";
const DASHBOARD_JS = "\n/* ============================================================\n   DATA\n   ============================================================ */\nconst DATA = window.__AMDATA;\n\nconst CFG = DATA.config;\nconst AMS = DATA.ams;\nconst ACCOUNTS = DATA.accounts;\nconst EVENTS = DATA.events;\nconst TOUCH = new Set(CFG.touchTypes);\n\n// Human names for each touch channel. shared_touch is a mechanism rather than a\n// channel, so it is described separately instead of listed here.\nconst TOUCH_LABELS = {\n  meeting: \"meeting\", call: \"call\", email_1to1: \"1:1 email\",\n  message: \"text/DM\", note: \"meaningful note\"\n};\n/** \"a meeting, call, 1:1 email, or text/DM\" -- generated, never hardcoded. */\nfunction touchPhrase() {\n  const parts = (CFG.touchTypes || []).filter(t => TOUCH_LABELS[t]).map(t => TOUCH_LABELS[t]);\n  if (!parts.length) return \"activity\";\n  if (parts.length === 1) return parts[0];\n  return parts.slice(0, -1).join(\", \") + \", or \" + parts[parts.length - 1];\n}\nconst CHECK_LABELS = CFG.checkLabels;\nconst UNAVAILABLE = new Set(\n  (DATA.capabilities.unavailableCompletenessChecks || []).map(c => c.key)\n);\n\nconst AM_BY_ID = new Map(AMS.map(a => [a.id, a]));\n// Teams are only meaningful when more than one exists. With AM_TEAMS unset every\n// AM falls back to \"Unassigned\", which next to a name reads as though the AM is\n// unassigned rather than teamless -- so suppress the label and the filter.\nconst TEAMS = [...new Set(AMS.map(a => a.team))].filter(Boolean);\nconst HAS_TEAMS = TEAMS.length > 1;\nconst ACC_BY_ID = new Map(ACCOUNTS.map(a => [a.id, a]));\nconst BOOK = ACCOUNTS.filter(a => a.inBook);\n\n/* ============================================================\n   STATE\n   ============================================================ */\nconst state = {\n  period: \"this_month\",\n  from: null,\n  to: null,\n  team: \"all\",\n  am: \"all\",\n  q: \"\",\n  tab: \"standings\",\n  sorts: {}\n};\n\n/* ============================================================\n   DATES\n   ============================================================ */\nfunction today() {\n  // Anchor to the sync date so a stale file still shows a sensible month.\n  const synced = DATA.meta && DATA.meta.synced_at ? new Date(DATA.meta.synced_at) : new Date();\n  return isNaN(synced) ? new Date() : synced;\n}\nfunction ymd(d) {\n  return d.getUTCFullYear() + \"-\" + String(d.getUTCMonth() + 1).padStart(2, \"0\")\n    + \"-\" + String(d.getUTCDate()).padStart(2, \"0\");\n}\nfunction shiftDays(d, n) {\n  const c = new Date(d.getTime());\n  c.setUTCDate(c.getUTCDate() + n);\n  return c;\n}\nconst PERIODS = [\n  { key: \"this_week\",  label: \"This Week\" },\n  { key: \"this_month\", label: \"This Month\" },\n  { key: \"last_30\",    label: \"Last 30\" },\n  { key: \"last_60\",    label: \"Last 60\" },\n  { key: \"last_90\",    label: \"Last 90\" },\n  { key: \"custom\",     label: \"Custom\" }\n];\n/** The competition's start date. No window may reach behind it. */\nconst PROGRAM_START = (DATA.meta && DATA.meta.program_start)\n  ? String(DATA.meta.program_start).slice(0, 10) : null;\n\nfunction clampStart(from) {\n  return (PROGRAM_START && from < PROGRAM_START) ? PROGRAM_START : from;\n}\n\nfunction periodRange(key) {\n  const now = today();\n  const end = ymd(now);\n  let from;\n  if (key === \"this_week\") {\n    const dow = now.getUTCDay();\n    from = ymd(shiftDays(now, dow === 0 ? -6 : 1 - dow));\n  } else if (key === \"this_month\") {\n    from = ymd(new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)));\n  } else if (key === \"last_30\") {\n    from = ymd(shiftDays(now, -29));\n  } else if (key === \"last_60\") {\n    from = ymd(shiftDays(now, -59));\n  } else if (key === \"last_90\") {\n    from = ymd(shiftDays(now, -89));\n  } else {\n    return [clampStart(state.from || ymd(shiftDays(now, -29))), state.to || end];\n  }\n  return [clampStart(from), end];\n}\nfunction activeRange() { return periodRange(state.period); }\n\n/** True when the selected preset was cut short by the program start. */\nfunction periodWasClamped(key) {\n  if (!PROGRAM_START || key === \"custom\") return false;\n  const now = today();\n  const raw = { this_week: -6, this_month: null, last_30: -29, last_60: -59, last_90: -89 }[key];\n  if (raw === null || raw === undefined) return false;\n  return ymd(shiftDays(now, raw)) < PROGRAM_START;\n}\n\n/** The equal-length window immediately before the active one (for Most Improved). */\nfunction priorRange() {\n  const [from, to] = activeRange();\n  const a = new Date(from + \"T00:00:00Z\");\n  const b = new Date(to + \"T00:00:00Z\");\n  const days = Math.max(1, Math.round((b - a) / 86400000) + 1);\n  return [ymd(shiftDays(a, -days)), ymd(shiftDays(a, -1))];\n}\n\n/* ============================================================\n   AGGREGATION  \u2014 caps applied inside the window, so a custom\n   range still honours \"once per company per period\".\n   ============================================================ */\nfunction amIdsInScope() {\n  let ids = AMS.map(a => a.id);\n  if (state.team !== \"all\") ids = ids.filter(id => (AM_BY_ID.get(id) || {}).team === state.team);\n  if (state.am !== \"all\") ids = ids.filter(id => id === state.am);\n  return ids;\n}\n\n/** ym (\"2026-03\") scopes the book to who owned each account that month. */\nfunction accountsFor(amId, ym) {\n  if (!ym || !DATA.ownerByMonth) return BOOK.filter(a => a.amId === amId);\n  const own = DATA.ownerByMonth;\n  return BOOK.filter(a => {\n    const hist = own[a.id];\n    return hist ? hist[ym] === amId : a.amId === amId;\n  });\n}\n\n/** Distinct days in the window on which this AM logged something in HubSpot. */\nfunction daysWorked(amId, from, to) {\n  const log = DATA.activityDays || [];\n  const days = new Set();\n  for (const row of log) {\n    if (row.am === amId && row.d >= from && row.d <= to) days.add(row.d);\n  }\n  return days.size;\n}\n\nfunction aggregate(from, to, amIds, ym) {\n  const scope = new Set(amIds);\n  const inWindow = EVENTS.filter(e => e.d >= from && e.d <= to && scope.has(e.am));\n\n  // Cap application: events are already date-sorted, so the earliest survive.\n  const capCount = new Map();\n  const kept = [];\n  for (const e of inWindow) {\n    if (e.cap) {\n      const n = (capCount.get(e.cap) || 0) + 1;\n      capCount.set(e.cap, n);\n      if (n > e.capN) continue;\n    }\n    kept.push(e);\n  }\n\n  const rows = amIds.map(amId => {\n    const am = AM_BY_ID.get(amId) || { id: amId, name: \"Owner \" + amId, team: \"Unassigned\" };\n    const mine = kept.filter(e => e.am === amId);\n    const assigned = accountsFor(amId, ym);\n\n    const counts = { meeting: 0, call: 0, email_1to1: 0, message: 0, note: 0,\n                     task_completed: 0, task_overdue: 0, account_review: 0,\n                     new_contact: 0, survey_positive: 0, survey_negative: 0 };\n    let engPts = 0, hygPts = 0, mgmtPts = 0;\n    const touched = new Set();\n    const hygieneByType = {};\n\n    for (const e of mine) {\n      if (counts[e.t] !== undefined) counts[e.t]++;\n      if (e.cat === \"engagement\") engPts += e.pts;\n      else if (e.cat === \"hygiene\") {\n        hygPts += e.pts;\n        hygieneByType[e.t] = (hygieneByType[e.t] || 0) + 1;\n      } else if (e.cat === \"coverage\") mgmtPts += e.pts;\n      if (TOUCH.has(e.t)) touched.add(e.co);\n    }\n\n    const assignedIds = new Set(assigned.map(a => a.id));\n    const touchedInBook = [...touched].filter(id => assignedIds.has(id));\n    const coveragePct = assigned.length ? (100 * touchedInBook.length / assigned.length) : 0;\n    const coverageTouchPts = touchedInBook.length * CFG.coveragePoints.unique_account_touched;\n\n    const completeness = assigned.length\n      ? assigned.reduce((s, a) => s + a.completeness, 0) / assigned.length\n      : 0;\n\n    const activities = counts.meeting + counts.call + counts.email_1to1\n                     + counts.message + counts.note;\n\n    return {\n      am, amId,\n      assigned: assigned.length,\n      assignedAccounts: assigned,\n      touched: touchedInBook.length,\n      touchedIds: new Set(touchedInBook),\n      coveragePct,\n      completeness,\n      counts,\n      hygieneByType,\n      engPts,\n      hygPts,\n      mgmtPts,\n      coveragePts: coverageTouchPts + mgmtPts,\n      activities,\n      daysWorked: daysWorked(amId, from, to),\n      actPerAccount: assigned.length ? activities / assigned.length : 0,\n      engPerAccount: assigned.length ? engPts / assigned.length : 0,\n      events: mine\n    };\n  });\n\n  return { rows, kept };\n}\n\n/**\n * Score each category 0-100, then weight.\n *\n * mode \"relative\" (the monthly leaderboard): normalize against the best performer\n * in scope, so the leader sits at 100. Reads as a race.\n *\n * mode \"absolute\" (the annual award): normalize against fixed targets, so a score\n * means the same thing in every month for every person. Relative scoring cannot\n * be averaged across a year -- it is zero-sum, so a weak month outscores a strong\n * one and collective improvement is invisible.\n */\nfunction scoreRows(rows, mode) {\n  const T = CFG.absoluteTargets || {};\n  const absolute = mode === \"absolute\";\n  const max = (fn) => Math.max(...rows.map(fn), 0) || 1;\n  const maxEngRate = absolute\n    ? (T.engagement_points_per_account || 3) : max(r => r.engPerAccount);\n  const maxEngAbs = absolute\n    ? (T.engagement_points_total || 60) : max(r => r.engPts);\n  const maxMgmt = absolute\n    ? (T.management_points || 25) : max(r => r.mgmtPts);\n  const maxHygAct = absolute\n    ? (T.hygiene_points || 12) : max(r => r.hygPts);\n\n  const w = CFG.categoryWeights;\n  const ew = CFG.engagementSubweights;\n  const cw = CFG.coverageSubweights;\n  const hw = CFG.hygieneSubweights;\n\n  // Overdue-task penalties can push a component negative; clamp so a component\n  // floors at 0 rather than eating into the other categories.\n  const clamp = v => Math.max(0, Math.min(100, isFinite(v) ? v : 0));\n\n  for (const r of rows) {\n    r.engagementScore = clamp(\n      ew.per_account_rate * (100 * r.engPerAccount / maxEngRate) +\n      ew.absolute_volume * (100 * r.engPts / maxEngAbs));\n    r.coverageScore = clamp(\n      cw.coverage_pct * r.coveragePct +\n      cw.management_actions * (100 * r.mgmtPts / maxMgmt));\n    r.hygieneScore = clamp(\n      hw.completeness_pct * r.completeness +\n      hw.hygiene_activity * (100 * r.hygPts / maxHygAct));\n    r.score =\n      w.engagement * r.engagementScore +\n      w.coverage * r.coverageScore +\n      w.hygiene * r.hygieneScore;\n  }\n  // Two reasons an AM appears but is not ranked:\n  //   not competing -- on the roster deliberately (ops, leadership); measured, not raced\n  //   small book    -- below the minimum, where a per-account rate stops being a\n  //                    rate and becomes an accident\n  // Both sort after everyone eligible and carry a visible reason, so nobody has to\n  // guess why a row has no number.\n  const minBook = CFG.minBookToRank ?? 0;\n  const nonCompeting = new Set(CFG.nonCompetingAmIds || []);\n  for (const r of rows) {\n    r.notCompeting = nonCompeting.has(r.amId);\n    r.smallBook = !r.notCompeting && r.assigned < minBook;\n    r.unranked = r.notCompeting || r.smallBook;\n    r.unrankedReason = r.notCompeting ? \"not competing\"\n      : r.smallBook ? \"small book\" : null;\n  }\n  rows.sort((a, b) => (a.unranked - b.unranked) || (b.score - a.score));\n  let rank = 0;\n  for (const r of rows) {\n    r.rank = r.unranked ? null : ++rank;\n  }\n  return rows;\n}\n\nfunction currentRows() {\n  const [from, to] = activeRange();\n  const { rows } = aggregate(from, to, amIdsInScope());\n  return scoreRows(rows);\n}\n\n/* ============================================================\n   FORMAT HELPERS\n   ============================================================ */\nconst n0 = v => (v == null || isNaN(v)) ? \"\u2014\" : Math.round(v).toLocaleString();\nconst n1 = v => (v == null || isNaN(v)) ? \"\u2014\" : v.toFixed(1);\nconst pct = v => (v == null || isNaN(v)) ? \"\u2014\" : Math.round(v) + \"%\";\nconst esc = s => String(s == null ? \"\" : s).replace(/[&<>\"']/g,\n  c => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n\nfunction healthPill(v) {\n  if (!v) return '<span class=\"pill plain\">not set</span>';\n  const t = String(v).toLowerCase();\n  if (t.includes(\"green\") || t.includes(\"healthy\")) return '<span class=\"pill good\">' + esc(v) + \"</span>\";\n  if (t.includes(\"yellow\") || t.includes(\"watch\")) return '<span class=\"pill warn\">' + esc(v) + \"</span>\";\n  if (t.includes(\"red\") || t.includes(\"risk\")) return '<span class=\"pill crit\">' + esc(v) + \"</span>\";\n  return '<span class=\"pill plain\">' + esc(v) + \"</span>\";\n}\nfunction agePill(days) {\n  if (days == null) return '<span class=\"pill crit\">never</span>';\n  if (days >= 60) return '<span class=\"pill crit\">' + days + \"d</span>\";\n  if (days >= 30) return '<span class=\"pill serious\">' + days + \"d</span>\";\n  if (days >= 14) return '<span class=\"pill warn\">' + days + \"d</span>\";\n  return '<span class=\"pill good\">' + days + \"d</span>\";\n}\nfunction meter(value, color) {\n  const w = Math.max(0, Math.min(100, value));\n  return '<div class=\"meter\"><div class=\"meter-track\"><div class=\"meter-fill\" style=\"width:'\n    + w.toFixed(1) + \"%;background:\" + color + '\"></div></div><span class=\"meter-val\">'\n    + pct(value) + \"</span></div>\";\n}\n\n/* Sortable table builder. cols: {key,label,align,render,value,nosort} */\nfunction buildTable(id, cols, rows, opts) {\n  opts = opts || {};\n  const sort = state.sorts[id] || opts.defaultSort || { key: cols[0].key, dir: 1 };\n  const col = cols.find(c => c.key === sort.key) || cols[0];\n  const valueOf = r => (col.value ? col.value(r) : r[col.key]);\n  // opts.pinLast keeps a group at the bottom whatever the user sorts by -- used so\n  // an unranked AM never appears interleaved with ranked ones, where a reader could\n  // mistake their position for a rank.\n  const pin = opts.pinLast || (() => 0);\n  const sorted = rows.slice().sort((a, b) => {\n    const pa = pin(a), pb = pin(b);\n    if (pa !== pb) return pa - pb;\n    const va = valueOf(a), vb = valueOf(b);\n    if (typeof va === \"string\" || typeof vb === \"string\") {\n      return String(va ?? \"\").localeCompare(String(vb ?? \"\")) * sort.dir;\n    }\n    return ((va ?? -Infinity) - (vb ?? -Infinity)) * sort.dir;\n  });\n\n  let html = '<div class=\"tablewrap\"><table data-table=\"' + id + '\"><thead><tr>';\n  for (const c of cols) {\n    const active = c.key === sort.key;\n    html += \"<th\" + (c.align === \"l\" ? ' class=\"l' : ' class=\"')\n      + (c.nosort ? \" nosort\" : \"\") + '\" '\n      + (c.nosort ? \"\" : 'data-sort=\"' + c.key + '\" ')\n      + (c.title ? 'title=\"' + esc(c.title) + '\" ' : \"\")\n      + \">\" + esc(c.label)\n      + (active ? '<span class=\"arrow\">' + (sort.dir > 0 ? \"\u25b2\" : \"\u25bc\") + \"</span>\" : \"\")\n      + \"</th>\";\n  }\n  html += \"</tr></thead><tbody>\";\n  if (!sorted.length) {\n    html += '<tr><td colspan=\"' + cols.length + '\" class=\"empty\">'\n      + esc(opts.empty || \"Nothing here for this filter.\") + \"</td></tr>\";\n  }\n  for (const r of sorted) {\n    const cls = [];\n    if (opts.rowClass) cls.push(opts.rowClass(r));\n    if (opts.onRowAm) cls.push(\"clickable\");\n    html += \"<tr\" + (cls.filter(Boolean).length ? ' class=\"' + cls.filter(Boolean).join(\" \") + '\"' : \"\")\n      + (opts.onRowAm ? ' data-am=\"' + esc(opts.onRowAm(r)) + '\"' : \"\") + \">\";\n    for (const c of cols) {\n      html += \"<td\" + (c.align === \"l\" ? ' class=\"l' + (c.cls ? \" \" + c.cls : \"\") + '\"'\n        : (c.cls ? ' class=\"' + c.cls + '\"' : \"\")) + \">\"\n        + (c.render ? c.render(r) : esc(valueOfCol(c, r))) + \"</td>\";\n    }\n    html += \"</tr>\";\n  }\n  html += \"</tbody></table></div>\";\n  return html;\n}\nfunction valueOfCol(c, r) { return c.value ? c.value(r) : r[c.key]; }\n\n/* ============================================================\n   SECTION 1 \u2014 STANDINGS\n   ============================================================ */\nfunction renderStandings() {\n  const rows = currentRows();\n  const [from, to] = activeRange();\n  let html = \"\";\n\n  if (periodWasClamped(state.period)) {\n    const label = (PERIODS.find(p => p.key === state.period) || {}).label || \"\";\n    html += '<div class=\"notice\"><div>'\n      + '<span class=\"headline\">Showing ' + esc(from) + \" to \" + esc(to)\n      + \", not the full \" + esc(label) + \".</span>\"\n      + \"The competition began <b>\" + esc(PROGRAM_START) + \"</b> and no HubSpot \"\n      + \"activity before that date was pulled, so this window starts there. \"\n      + \"Coverage percentages and per-account rates are computed over \"\n      + Math.round((new Date(to) - new Date(from)) / 86400000 + 1)\n      + \" days \u2014 read them as a partial period, not a monthly rate.\"\n      + \"</div></div>\";\n  }\n\n  // Data-availability notice.\n  const unavail = DATA.capabilities.unavailableCompletenessChecks || [];\n  if (!DATA.capabilities.propertyHistory || unavail.length) {\n    html += '<div class=\"notice\"><div>';\n    html += '<span class=\"headline\">Some metrics are unavailable in this dataset.</span>';\n    if (!DATA.capabilities.propertyHistory) {\n      html += \"Property history was not synced, so CRM Hygiene is scored on portfolio \"\n        + \"completeness and new contacts only \u2014 no credit for field updates. \";\n    }\n    if (unavail.length) {\n      html += \"These completeness checks are skipped because the property is not mapped: \"\n        + unavail.map(u => \"<b>\" + esc(u.label) + \"</b>\").join(\", \")\n        + \". They are excluded from the denominator rather than counted as failures.\";\n    }\n    html += \"</div></div>\";\n  }\n\n  // Podium.\n  const top3 = rows.slice(0, 3);\n  if (top3.length === 3) {\n    html += '<div class=\"podium\">';\n    const medals = [\"\ud83e\udd47\", \"\ud83e\udd48\", \"\ud83e\udd49\"];\n    top3.forEach((r, i) => {\n      html += '<button class=\"pod r' + (i + 1) + '\" data-am=\"' + esc(r.amId) + '\" type=\"button\">'\n        + '<div class=\"pod-rank\">' + medals[i] + \" Rank \" + (i + 1) + \"</div>\"\n        + '<div class=\"pod-name\">' + esc(r.am.name) + \"</div>\"\n        + '<div class=\"pod-score\"><b>' + n1(r.score) + \"</b><span>AM Score</span></div>\"\n        + '<div class=\"pod-stats\">'\n        + '<div><span class=\"k\">Coverage</span><span class=\"v\">' + pct(r.coveragePct)\n        + '</span><span class=\"s\">' + r.touched + \" of \" + r.assigned + \"</span></div>\"\n        + '<div><span class=\"k\">CRM Complete</span><span class=\"v\">' + pct(r.completeness)\n        + '</span><span class=\"s\">book-wide</span></div>'\n        + '<div><span class=\"k\">Activities</span><span class=\"v\">' + n0(r.activities)\n        + '</span><span class=\"s\">' + n1(r.actPerAccount) + \" / account</span></div>\"\n        + \"</div></button>\";\n    });\n    html += \"</div>\";\n  }\n\n  // Standings table.\n  const cols = [\n    { key: \"rank\", label: \"#\", align: \"l\", cls: \"rank-cell\",\n      value: r => r.rank ?? 999,\n      render: r => r.rank\n        ? r.rank\n        : '<span title=\"' + esc(r.notCompeting\n            ? \"On the roster but not competing -- measured, not ranked\"\n            : \"Book under \" + (CFG.minBookToRank ?? 0) + \" accounts, so not ranked\")\n          + '\">&ndash;</span>' },\n    { key: \"name\", label: \"Account Manager\", align: \"l\", cls: \"name\",\n      value: r => r.am.name, render: r => esc(r.am.name)\n        + (HAS_TEAMS\n            ? ' <span class=\"muted\" style=\"font-weight:500\">\u00b7 ' + esc(r.am.team) + \"</span>\"\n            : \"\")\n        + (r.unranked\n            ? ' <span class=\"pill plain\" title=\"' + esc(r.notCompeting\n                ? \"Deliberately not competing. Their book, coverage and hygiene are \"\n                  + \"still measured and included in portfolio totals.\"\n                : \"Fewer than \" + (CFG.minBookToRank ?? 0) + \" accounts, so a \"\n                  + \"per-account rate is not meaningful. Shown but not ranked.\")\n              + '\">' + esc(r.unrankedReason) + \"</span>\"\n            : \"\") },\n    { key: \"score\", label: \"AM Score\", cls: \"score-cell\", render: r => n1(r.score),\n      title: \"Weighted index, 0-100. Leader in scope = 100.\" },\n    { key: \"coveragePct\", label: \"Coverage\", render: r => meter(r.coveragePct, \"var(--cat-cov)\") },\n    { key: \"completeness\", label: \"CRM Complete\", render: r => meter(r.completeness, \"var(--cat-hyg)\") },\n    { key: \"meetings\", label: \"Mtgs\", value: r => r.counts.meeting, render: r => n0(r.counts.meeting) },\n    { key: \"calls\", label: \"Calls\", value: r => r.counts.call, render: r => n0(r.counts.call) },\n    { key: \"emails\", label: \"Emails\", value: r => r.counts.email_1to1, render: r => n0(r.counts.email_1to1) },\n    { key: \"messages\", label: \"SMS/DM\", value: r => r.counts.message,\n      title: \"SMS, WhatsApp and LinkedIn messages logged in HubSpot\",\n      render: r => n0(r.counts.message) },\n    { key: \"notes\", label: \"Notes\", value: r => r.counts.note, render: r => n0(r.counts.note) },\n    { key: \"tasks\", label: \"Tasks Done\", value: r => r.counts.task_completed,\n      render: r => n0(r.counts.task_completed) },\n    { key: \"taskMissed\", label: \"Missed\", value: r => r.counts.task_overdue,\n      title: \"Tasks still open past their due date, each \" + CFG.incompleteTaskPenalty + \" point\",\n      render: r => r.counts.task_overdue > 0\n        ? '<b style=\"color:var(--critical-text)\">' + r.counts.task_overdue + \"</b>\" : \"0\" },\n    { key: \"survey\", label: \"CSAT/NPS\", value: r => r.counts.survey_positive,\n      title: \"Positive NPS or CSAT responses this period, +\"\n        + (CFG.surveyPoints ?? 10) + \" each\",\n      render: r => r.counts.survey_positive > 0\n        ? '<b style=\"color:var(--good-text)\">' + r.counts.survey_positive + \"</b>\" : \"0\" },\n    { key: \"touched\", label: \"Accts Touched\",\n      render: r => '<b>' + r.touched + '</b><span class=\"muted\"> / ' + r.assigned + \"</span>\" }\n  ];\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Overall Leaderboard</h2>'\n    + \"<p>\" + esc(from) + \" to \" + esc(to) + \" \u00b7 \" + rows.length + \" AMs \u00b7 click a row for the full breakdown</p>\"\n    + '</div><div class=\"card-body flush\">'\n    + buildTable(\"standings\", cols, rows, {\n        defaultSort: { key: \"score\", dir: -1 },\n        onRowAm: r => r.amId,\n        pinLast: r => r.unranked ? 1 : 0,\n        rowClass: r => (r.rank && r.rank <= 3) ? \"top\" + r.rank : \"\",\n        empty: \"No AMs match this filter.\"\n      })\n    + \"</div></div>\";\n\n  // Score breakdown.\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Score Breakdown</h2>'\n    + \"<p>Weighted contribution to each AM's score \u2014 this is why they rank where they do</p></div>\"\n    + '<div class=\"card-body\">'\n    + '<div class=\"legend\" style=\"margin-bottom:14px\">'\n    + '<span><i class=\"swatch\" style=\"background:var(--cat-eng)\"></i>Client Engagement ('\n    + Math.round(CFG.categoryWeights.engagement * 100) + \"%)</span>\"\n    + '<span><i class=\"swatch\" style=\"background:var(--cat-cov)\"></i>Account Coverage ('\n    + Math.round(CFG.categoryWeights.coverage * 100) + \"%)</span>\"\n    + '<span><i class=\"swatch\" style=\"background:var(--cat-hyg)\"></i>CRM Hygiene ('\n    + Math.round(CFG.categoryWeights.hygiene * 100) + \"%)</span></div>\";\n\n  const maxScore = Math.max(...rows.map(r => r.score), 1);\n  for (const r of rows) {\n    const e = CFG.categoryWeights.engagement * r.engagementScore;\n    const c = CFG.categoryWeights.coverage * r.coverageScore;\n    const h = CFG.categoryWeights.hygiene * r.hygieneScore;\n    const scale = 100 / maxScore;\n    // An AM with no activity in the window scores 0; guard the share maths so it\n    // renders an empty bar rather than NaN.\n    const share = v => r.score > 0 ? (100 * v / r.score).toFixed(1) : \"0\";\n    html += '<div class=\"hbar-row\"><div class=\"hbar-name\">' + esc(r.am.name) + \"</div>\"\n      + '<div class=\"hbar-track\"><div class=\"stack\" style=\"width:' + (r.score * scale).toFixed(1) + '%\">'\n      + '<i style=\"background:var(--cat-eng);width:' + share(e) + '%\" title=\"Engagement '\n      + n1(e) + '\"></i>'\n      + '<i style=\"background:var(--cat-cov);width:' + share(c) + '%\" title=\"Coverage '\n      + n1(c) + '\"></i>'\n      + '<i style=\"background:var(--cat-hyg);width:' + share(h) + '%\" title=\"Hygiene '\n      + n1(h) + '\"></i>'\n      + \"</div></div>\"\n      + '<div class=\"hbar-val\">' + n1(r.score) + \"</div></div>\";\n  }\n  html += '<div class=\"tablewrap\" style=\"margin-top:16px\">'\n    + buildTable(\"breakdown\", [\n        { key: \"name\", label: \"Account Manager\", align: \"l\", cls: \"name\", value: r => r.am.name,\n          render: r => esc(r.am.name) },\n        { key: \"eng\", label: \"Engagement (0-100)\", value: r => r.engagementScore,\n          render: r => n1(r.engagementScore) },\n        { key: \"engW\", label: \"\u00d7 45%\", value: r => CFG.categoryWeights.engagement * r.engagementScore,\n          render: r => '<span class=\"muted\">' + n1(CFG.categoryWeights.engagement * r.engagementScore) + \"</span>\" },\n        { key: \"cov\", label: \"Coverage (0-100)\", value: r => r.coverageScore,\n          render: r => n1(r.coverageScore) },\n        { key: \"covW\", label: \"\u00d7 30%\", value: r => CFG.categoryWeights.coverage * r.coverageScore,\n          render: r => '<span class=\"muted\">' + n1(CFG.categoryWeights.coverage * r.coverageScore) + \"</span>\" },\n        { key: \"hyg\", label: \"Hygiene (0-100)\", value: r => r.hygieneScore,\n          render: r => n1(r.hygieneScore) },\n        { key: \"hygW\", label: \"\u00d7 25%\", value: r => CFG.categoryWeights.hygiene * r.hygieneScore,\n          render: r => '<span class=\"muted\">' + n1(CFG.categoryWeights.hygiene * r.hygieneScore) + \"</span>\" },\n        { key: \"score\", label: \"AM Score\", cls: \"score-cell\", render: r => n1(r.score) }\n      ], rows, { defaultSort: { key: \"score\", dir: -1 },\n                 pinLast: r => r.unranked ? 1 : 0 })\n    + \"</div>\";\n  html += \"</div></div>\";\n\n  html += methodologyHtml();\n  return html;\n}\n\n/* ============================================================\n   SECTION 3 \u2014 COVERAGE\n   ============================================================ */\nfunction renderCoverage() {\n  const rows = currentRows();\n  const [from, to] = activeRange();\n\n  const totalAssigned = rows.reduce((s, r) => s + r.assigned, 0);\n  const totalTouched = rows.reduce((s, r) => s + r.touched, 0);\n  const stale30 = [], stale60 = [];\n  for (const r of rows) {\n    for (const a of r.assignedAccounts) {\n      if (a.daysSinceActivity == null || a.daysSinceActivity >= 60) stale60.push(a);\n      else if (a.daysSinceActivity >= 30) stale30.push(a);\n    }\n  }\n\n  let html = '<div class=\"card\"><div class=\"card-head\"><h2>Account Coverage</h2>'\n    + \"<p>\" + esc(from) + \" to \" + esc(to)\n    + \" \u00b7 a touch means a \" + touchPhrase()\n    + (TOUCH.has(\"note\") ? \"\" : \" \u2014 a note to yourself is not a touch\") + \"</p></div>\"\n    + '<div class=\"card-body\"><div class=\"tiles\">'\n    + tile(\"Total assigned\", n0(totalAssigned), \"active client accounts in scope\")\n    + tile(\"Accounts touched\", n0(totalTouched),\n        pct(totalAssigned ? 100 * totalTouched / totalAssigned : 0) + \" of the book\")\n    + tile(\"Untouched this period\", n0(totalAssigned - totalTouched), \"no meeting, call, or email\",\n        totalAssigned - totalTouched > 0)\n    + tile(\"Quiet 30-59 days\", n0(stale30.length), \"based on last activity date\")\n    + tile(\"Quiet 60+ days\", n0(stale60.length), \"includes never-touched\", stale60.length > 0)\n    + \"</div></div></div>\";\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Coverage by Account Manager</h2>'\n    + \"<p>Portfolio reach, independent of how much activity each account got</p></div>\"\n    + '<div class=\"card-body\">';\n  const maxAssigned = Math.max(...rows.map(r => r.assigned), 1);\n  for (const r of rows.slice().sort((a, b) => b.coveragePct - a.coveragePct)) {\n    html += '<div class=\"hbar-row\"><div class=\"hbar-name\">' + esc(r.am.name) + \"</div>\"\n      + '<div class=\"hbar-track\" title=\"' + r.touched + \" of \" + r.assigned + ' accounts touched\">'\n      + '<div class=\"hbar-fill\" style=\"width:' + r.coveragePct.toFixed(1)\n      + '%;background:var(--cat-cov)\"></div></div>'\n      + '<div class=\"hbar-val\">' + pct(r.coveragePct)\n      + '<span class=\"muted\" style=\"font-weight:500\"> \u00b7 ' + r.touched + \"/\" + r.assigned\n      + \"</span></div></div>\";\n  }\n  html += '<div style=\"margin-top:16px\">'\n    + buildTable(\"coverage\", [\n        { key: \"name\", label: \"Account Manager\", align: \"l\", cls: \"name\", value: r => r.am.name,\n          render: r => esc(r.am.name) },\n        ...(HAS_TEAMS ? [{ key: \"team\", label: \"Team\", align: \"l\",\n            value: r => r.am.team, render: r => esc(r.am.team) }] : []),\n        { key: \"assigned\", label: \"Assigned\", render: r => n0(r.assigned) },\n        { key: \"touched\", label: \"Touched\", render: r => n0(r.touched) },\n        { key: \"untouched\", label: \"Untouched\", value: r => r.assigned - r.touched,\n          render: r => {\n            const v = r.assigned - r.touched;\n            return v > 0 ? '<b style=\"color:var(--critical-text)\">' + v + \"</b>\" : \"0\";\n          } },\n        { key: \"coveragePct\", label: \"Coverage %\", render: r => meter(r.coveragePct, \"var(--cat-cov)\") },\n        { key: \"q30\", label: \"Quiet 30+\", value: r => countQuiet(r, 30),\n          render: r => n0(countQuiet(r, 30)) },\n        { key: \"q60\", label: \"Quiet 60+\", value: r => countQuiet(r, 60),\n          render: r => {\n            const v = countQuiet(r, 60);\n            return v > 0 ? '<b style=\"color:var(--critical-text)\">' + v + \"</b>\" : \"0\";\n          } }\n      ], rows, { defaultSort: { key: \"coveragePct\", dir: -1 }, onRowAm: r => r.amId })\n    + \"</div></div></div>\";\n\n  // Untouched account list.\n  const untouchedRows = [];\n  for (const r of rows) {\n    for (const a of r.assignedAccounts) {\n      if (!r.touchedIds.has(a.id)) untouchedRows.push({ acc: a, am: r.am });\n    }\n  }\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Accounts Not Touched This Period</h2>'\n    + \"<p>\" + untouchedRows.length + \" accounts \u00b7 no \" + touchPhrase() + \" between \"\n    + esc(from) + \" and \" + esc(to) + '</p></div><div class=\"card-body flush\">'\n    + buildTable(\"untouched\", accountCols(), filterAccounts(untouchedRows), {\n        defaultSort: { key: \"days\", dir: -1 },\n        empty: \"Every assigned account was touched. Genuinely good.\"\n      })\n    + \"</div></div>\";\n  return html;\n}\nfunction countQuiet(r, threshold) {\n  return r.assignedAccounts.filter(\n    a => a.daysSinceActivity == null || a.daysSinceActivity >= threshold\n  ).length;\n}\nfunction tile(k, v, s, alert) {\n  return '<div class=\"tile' + (alert ? \" alert\" : \"\") + '\"><div class=\"k\">' + esc(k)\n    + '</div><div class=\"v\">' + v + '</div><div class=\"s\">' + esc(s) + \"</div></div>\";\n}\n/** full=true lists every missing field; otherwise shows two plus a \"+N more\". */\nfunction accountCols(full) {\n  return [\n    { key: \"name\", label: \"Client\", align: \"l\", cls: \"name\", value: r => r.acc.name,\n      render: r => esc(r.acc.name) },\n    { key: \"am\", label: \"Account Manager\", align: \"l\", value: r => r.am ? r.am.name : \"\",\n      render: r => esc(r.am ? r.am.name : \"\u2014\") },\n    { key: \"last\", label: \"Last activity\", align: \"l\", value: r => r.acc.lastActivity || \"\",\n      render: r => esc(r.acc.lastActivity || \"never\") },\n    { key: \"days\", label: \"Days since\", value: r => r.acc.daysSinceActivity ?? 9999,\n      render: r => agePill(r.acc.daysSinceActivity) },\n    { key: \"health\", label: \"Health\", align: \"l\", value: r => r.acc.health || \"\",\n      render: r => healthPill(r.acc.health) },\n    { key: \"complete\", label: \"CRM complete\", value: r => r.acc.completeness,\n      render: r => meter(r.acc.completeness, \"var(--cat-hyg)\") },\n    { key: \"missing\", label: \"Missing\", align: \"l\", cls: full ? \"wrap\" : \"\", nosort: true,\n      render: r => {\n        const all = r.acc.missing;\n        if (!all.length) return '<span class=\"pill good\">complete</span>';\n        const labels = all.map(m => CHECK_LABELS[m] || m);\n        if (full) {\n          return labels.map(l => '<span class=\"chip miss\">' + esc(l) + \"</span>\").join(\"\");\n        }\n        const shown = labels.slice(0, 2)\n          .map(l => '<span class=\"chip miss\">' + esc(l) + \"</span>\").join(\"\");\n        const rest = labels.length - 2;\n        return shown + (rest > 0\n          ? '<span class=\"chip\" title=\"' + esc(labels.join(\", \")) + '\">+' + rest + \" more</span>\"\n          : \"\");\n      } }\n  ];\n}\nfunction filterAccounts(list) {\n  const q = state.q.trim().toLowerCase();\n  if (!q) return list;\n  return list.filter(r => String(r.acc.name).toLowerCase().includes(q));\n}\n\n/* ============================================================\n   SECTION 4 \u2014 CRM HYGIENE\n   ============================================================ */\nfunction renderHygiene() {\n  const rows = currentRows();\n  const scopeAccounts = rows.flatMap(r => r.assignedAccounts.map(a => ({ acc: a, am: r.am })));\n\n  // Missing-field counts across the accounts in scope.\n  const counts = {};\n  for (const { acc } of scopeAccounts) {\n    for (const m of acc.missing) counts[m] = (counts[m] || 0) + 1;\n  }\n  const checkKeys = Object.keys(CHECK_LABELS).filter(k => !UNAVAILABLE.has(k));\n  // A conditional check (Google Ads CID, paid budget, GA/GTM) only applies to\n  // accounts buying that service. Counting gaps out of ALL accounts would imply a\n  // problem on accounts where the field should never be filled.\n  const applicable = {};\n  for (const k of checkKeys) {\n    applicable[k] = scopeAccounts.filter(\n      ({ acc }) => !(acc.notApplicable || []).includes(k)).length;\n  }\n  const maxMissing = Math.max(...checkKeys.map(k => counts[k] || 0), 1);\n\n  let html = '<div class=\"card\"><div class=\"card-head\"><h2>Most Commonly Missing Fields</h2>'\n    + \"<p>Across \" + scopeAccounts.length + \" accounts in scope \u2014 the fields to fix first</p></div>\"\n    + '<div class=\"card-body\">';\n  for (const k of checkKeys.slice().sort((a, b) => (counts[b] || 0) - (counts[a] || 0))) {\n    const v = counts[k] || 0;\n    const app = applicable[k] || 0;\n    const naCount = scopeAccounts.length - app;\n    html += '<div class=\"hbar-row\"><div class=\"hbar-name\" style=\"width:auto\">'\n      + esc(CHECK_LABELS[k])\n      + (naCount > 0\n          ? ' <span class=\"chip\" title=\"Only applies to accounts buying the '\n            + 'matching service\">' + app + \" apply</span>\"\n          : \"\")\n      + \"</div>\"\n      + '<div class=\"hbar-track\"><div class=\"hbar-fill\" style=\"width:'\n      + (100 * v / maxMissing).toFixed(1) + '%;background:var(--cat-hyg)\"></div></div>'\n      + '<div class=\"hbar-val\">' + v + '<span class=\"muted\" style=\"font-weight:500\"> \u00b7 '\n      + pct(app ? 100 * v / app : 0) + \"</span></div></div>\";\n  }\n  if (UNAVAILABLE.size) {\n    html += '<p class=\"muted\" style=\"margin:14px 0 0;font-size:12.5px\">Not evaluated (property not mapped in config.py): '\n      + [...UNAVAILABLE].map(k => esc(CHECK_LABELS[k] || k)).join(\", \") + \".</p>\";\n  }\n  html += \"</div></div>\";\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>CRM Completeness by Account Manager</h2>'\n    + \"<p>Portfolio-wide completeness, plus the gap counts behind it</p></div>\"\n    + '<div class=\"card-body flush\">'\n    + buildTable(\"hygieneAm\", [\n        { key: \"name\", label: \"Account Manager\", align: \"l\", cls: \"name\", value: r => r.am.name,\n          render: r => esc(r.am.name) },\n        { key: \"completeness\", label: \"CRM Complete\", render: r => meter(r.completeness, \"var(--cat-hyg)\") },\n        { key: \"assigned\", label: \"Accounts\", render: r => n0(r.assigned) },\n        ...checkKeys.map(k => ({\n          key: \"miss_\" + k, label: CHECK_LABELS[k],\n          title: \"Accounts missing \" + CHECK_LABELS[k],\n          value: r => r.assignedAccounts.filter(a => a.missing.includes(k)).length,\n          render: r => {\n            const v = r.assignedAccounts.filter(a => a.missing.includes(k)).length;\n            const app = r.assignedAccounts.filter(\n              a => !(a.notApplicable || []).includes(k)).length;\n            if (app === 0) return '<span class=\"muted\" title=\"Does not apply to any '\n              + 'account in this book\">n/a</span>';\n            const suffix = app < r.assignedAccounts.length\n              ? '<span class=\"muted\" style=\"font-weight:500\">/' + app + \"</span>\" : \"\";\n            return v > 0\n              ? '<b style=\"color:var(--critical-text)\">' + v + \"</b>\" + suffix\n              : \"0\" + suffix;\n          }\n        })),\n        { key: \"hygPts\", label: \"Hygiene pts\", render: r => n1(r.hygPts),\n          title: \"Points earned this period for filling or updating tracked fields\" }\n      ], rows, { defaultSort: { key: \"completeness\", dir: -1 }, onRowAm: r => r.amId })\n    + \"</div></div>\";\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Drill Into Accounts</h2>'\n    + \"<p>Every account in scope with its completeness and exactly what is missing\"\n    + (state.q ? \" \u00b7 filtered by \u201c\" + esc(state.q) + \"\u201d\" : \"\") + \"</p></div>\"\n    + '<div class=\"card-body flush\">'\n    + buildTable(\"hygieneAcc\", accountCols(true), filterAccounts(scopeAccounts), {\n        defaultSort: { key: \"complete\", dir: 1 }\n      })\n    + \"</div></div>\";\n  return html;\n}\n\n/* ============================================================\n   SECTION 5 \u2014 ENGAGEMENT\n   ============================================================ */\nfunction renderEngagement() {\n  const rows = currentRows();\n  const [from, to] = activeRange();\n\n  let html = '<div class=\"card\"><div class=\"card-head\"><h2>Client Engagement</h2>'\n    + \"<p>\" + esc(from) + \" to \" + esc(to)\n    + \" \u00b7 per-account rates sit beside raw counts so a bigger book is not an automatic advantage</p></div>\"\n    + '<div class=\"card-body flush\">'\n    + buildTable(\"engagement\", [\n        { key: \"name\", label: \"Account Manager\", align: \"l\", cls: \"name\", value: r => r.am.name,\n          render: r => esc(r.am.name) },\n        { key: \"assigned\", label: \"Book size\", render: r => n0(r.assigned) },\n        { key: \"meeting\", label: \"Meetings\", value: r => r.counts.meeting, render: r => n0(r.counts.meeting) },\n        { key: \"call\", label: \"Calls\", value: r => r.counts.call, render: r => n0(r.counts.call) },\n        { key: \"email\", label: \"Emails\", value: r => r.counts.email_1to1, render: r => n0(r.counts.email_1to1) },\n        { key: \"message\", label: \"SMS/DM\", value: r => r.counts.message,\n          render: r => n0(r.counts.message) },\n        { key: \"note\", label: \"Notes\", value: r => r.counts.note, render: r => n0(r.counts.note) },\n        { key: \"tasks\", label: \"Tasks done\", value: r => r.counts.task_completed,\n          render: r => n0(r.counts.task_completed) },\n        { key: \"taskMissed\", label: \"Missed tasks\",\n          title: \"Tasks still open past their due date, each \" + CFG.incompleteTaskPenalty\n            + \" point\",\n          value: r => r.counts.task_overdue,\n          render: r => r.counts.task_overdue > 0\n            ? '<b style=\"color:var(--critical-text)\">' + r.counts.task_overdue + \"</b>\"\n            : \"0\" },\n        { key: \"daysWorked\", label: \"Days in HubSpot\", value: r => r.daysWorked,\n          title: \"Separate days on which this AM logged something against a client \"\n            + \"account. Dated by when the record was created, not the activity date.\",\n          render: r => r.daysWorked > 0 ? \"<b>\" + r.daysWorked + \"</b>\" : \"0\" },\n        { key: \"activities\", label: \"Total\", render: r => \"<b>\" + n0(r.activities) + \"</b>\" },\n        { key: \"actPerAccount\", label: \"Per account\", render: r => \"<b>\" + n1(r.actPerAccount) + \"</b>\",\n          title: \"Total client activities divided by assigned accounts\" },\n        { key: \"engPts\", label: \"Engagement pts\", render: r => n1(r.engPts) },\n        { key: \"engPerAccount\", label: \"Pts / account\", render: r => n1(r.engPerAccount) }\n      ], rows, { defaultSort: { key: \"actPerAccount\", dir: -1 }, onRowAm: r => r.amId })\n    + \"</div></div>\";\n\n  // Mix by AM, as a share stack \u2014 shows habit, not just volume.\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Activity Mix</h2>'\n    + \"<p>What each AM's client contact is made of. A book worked only by email looks \"\n    + \"very different from one worked by phone.</p></div><div class=\\\"card-body\\\">\"\n    + '<div class=\"legend\" style=\"margin-bottom:14px\">'\n    + '<span><i class=\"swatch\" style=\"background:var(--cat-eng)\"></i>Meetings</span>'\n    + '<span><i class=\"swatch\" style=\"background:var(--cat-cov)\"></i>Calls</span>'\n    + '<span><i class=\"swatch\" style=\"background:var(--cat-hyg)\"></i>1:1 Emails</span>'\n    + '<span><i class=\"swatch\" style=\"background:var(--navy)\"></i>SMS/DM</span>'\n    + '<span><i class=\"swatch\" style=\"background:var(--ink-3)\"></i>Notes</span></div>';\n  for (const r of rows) {\n    const total = r.activities || 1;\n    const parts = [\n      [r.counts.meeting, \"var(--cat-eng)\", \"Meetings\"],\n      [r.counts.call, \"var(--cat-cov)\", \"Calls\"],\n      [r.counts.email_1to1, \"var(--cat-hyg)\", \"1:1 emails\"],\n      [r.counts.message, \"var(--navy)\", \"SMS / WhatsApp / LinkedIn\"],\n      [r.counts.note, \"var(--ink-3)\", \"Notes\"]\n    ];\n    html += '<div class=\"hbar-row\"><div class=\"hbar-name\">' + esc(r.am.name) + \"</div>\"\n      + '<div class=\"hbar-track\"><div class=\"stack\" style=\"width:100%\">'\n      + parts.map(([v, c, lbl]) => v > 0\n          ? '<i style=\"background:' + c + \";width:\" + (100 * v / total).toFixed(1)\n            + '%\" title=\"' + lbl + \": \" + v + '\"></i>'\n          : \"\").join(\"\")\n      + \"</div></div>\"\n      + '<div class=\"hbar-val\">' + n0(r.activities) + \"</div></div>\";\n  }\n  html += \"</div></div>\";\n\n  // Notetaker coverage -- surfaced because \"Fathom is connected\" and \"Fathom is\n  // writing to HubSpot\" turned out to be different things.\n  const cap = DATA.capabilities || {};\n  if (cap.meetingsTotal) {\n    const pctTx = 100 * (cap.meetingsWithTranscript || 0) / cap.meetingsTotal;\n    html += '<div class=\"card\"><div class=\"card-head\"><h2>Notetaker Coverage</h2>'\n      + \"<p>Meetings carrying an AI transcript. If a notetaker is meant to be \"\n      + \"capturing client calls, this proves whether it reaches HubSpot.</p></div>\"\n      + '<div class=\"card-body\"><div class=\"tiles\">'\n      + tile(\"Meetings pulled\", n0(cap.meetingsTotal), \"in the synced window\")\n      + tile(\"With a transcript\", n0(cap.meetingsWithTranscript || 0),\n          pct(pctTx) + \" of meetings\", (cap.meetingsWithTranscript || 0) === 0)\n      + \"</div>\"\n      + ((cap.meetingsWithTranscript || 0) === 0\n          ? '<p class=\"muted\" style=\"margin:14px 0 0;font-size:12.5px\">No meeting in '\n            + \"this window carries a transcript, notetaker source, or recording. \"\n            + \"Whatever notetaker is running is not writing back to HubSpot, so \"\n            + \"those client conversations cannot be scored.\"\n            + \"</p>\"\n          : \"\")\n      + \"</div></div>\";\n  }\n\n  // What the anti-gaming rules removed.\n  const excl = Object.assign({}, DATA.excluded.engagement, DATA.excluded.hygiene);\n  const exclRows = Object.entries(excl).sort((a, b) => b[1] - a[1]);\n  if (exclRows.length) {\n    html += '<div class=\"card\"><div class=\"card-head\"><h2>Excluded by Anti-Gaming Rules</h2>'\n      + \"<p>Activity present in HubSpot that did not score, and why. Portfolio-wide, \"\n      + \"across the whole synced window.</p></div><div class=\\\"card-body flush\\\">\"\n      + '<div class=\"tablewrap\"><table><thead><tr><th class=\"l\">Reason</th><th>Activities</th></tr></thead><tbody>'\n      + exclRows.map(([k, v]) => \"<tr><td class=\\\"l\\\">\" + esc(k) + \"</td><td><b>\" + n0(v) + \"</b></td></tr>\").join(\"\")\n      + \"</tbody></table></div></div></div>\";\n  }\n  return html;\n}\n\n/* ============================================================\n   SECTION 6 \u2014 MANAGEMENT ALERTS\n   ============================================================ */\nfunction renderAlerts() {\n  const rows = currentRows();\n  const scopeIds = new Set(rows.map(r => r.amId));\n  const all = rows.flatMap(r => r.assignedAccounts.map(a => ({ acc: a, am: r.am })));\n\n  const quiet30 = all.filter(r => r.acc.daysSinceActivity != null\n    && r.acc.daysSinceActivity >= 30 && r.acc.daysSinceActivity < 60);\n  const quiet60 = all.filter(r => r.acc.daysSinceActivity == null || r.acc.daysSinceActivity >= 60);\n  const noContact = all.filter(r => r.acc.missing.includes(\"primary_contact\"));\n  const noBudget = all.filter(r => r.acc.missing.includes(\"budget\"));\n  const noHealth = all.filter(r => r.acc.missing.includes(\"account_health\"));\n  const noGoals = all.filter(r => r.acc.missing.includes(\"client_goals\"));\n  const noRenewal = all.filter(r => r.acc.missing.includes(\"renewal_date\"));\n  const incomplete = all.filter(r => r.acc.completeness < 70);\n  const overdue = (DATA.overdueTasks || []).filter(t => !t.amId || scopeIds.has(t.amId));\n\n  let html = '<div class=\"card\"><div class=\"card-head\"><h2>Exception Summary</h2>'\n    + \"<p>Every list below is sortable and respects the client search box</p></div>\"\n    + '<div class=\"card-body\"><div class=\"tiles\">'\n    + tile(\"Quiet 30-59 days\", n0(quiet30.length), \"no logged activity\", quiet30.length > 0)\n    + tile(\"Quiet 60+ days\", n0(quiet60.length), \"includes never-touched\", quiet60.length > 0)\n    + tile(\"Overdue tasks\", n0(overdue.length), \"past due, not completed\", overdue.length > 0)\n    + tile(\"No primary contact\", n0(noContact.length), \"no associated contact\", noContact.length > 0)\n    + tile(\"Missing budget\", n0(noBudget.length), \"budget field empty\", noBudget.length > 0)\n    + tile(\"Missing health\", n0(noHealth.length), \"account health empty\", noHealth.length > 0)\n    + tile(\"Under 70% complete\", n0(incomplete.length), \"CRM record needs work\", incomplete.length > 0)\n    + tile(\"Meetings booked\", n0((DATA.upcomingMeetings || []).length),\n        \"scheduled, not yet held\")\n    + tile(\"Unhappy clients\", n0((DATA.surveyDetractors || []).length),\n        \"NPS/CSAT detractors\", (DATA.surveyDetractors || []).length > 0)\n    + tile(\"No owner set\", n0((DATA.unownedAccounts || []).length),\n        \"nobody accountable\", (DATA.unownedAccounts || []).length > 0)\n    + tile(\"Owner off roster\", n0((DATA.offRosterAccounts || []).length),\n        \"not in any AM's book\", (DATA.offRosterAccounts || []).length > 0)\n    + \"</div></div></div>\";\n\n  const lists = [\n    [\"No Activity in 30-59 Days\", quiet30, \"quiet30\"],\n    [\"No Activity in 60+ Days\", quiet60, \"quiet60\"],\n    [\"No Primary Contact\", noContact, \"nocontact\"],\n    [\"Missing Budget Information\", noBudget, \"nobudget\"],\n    [\"Missing Account Health\", noHealth, \"nohealth\"],\n    [\"Missing Client Goals\", noGoals, \"nogoals\"],\n    [\"Missing Renewal Information\", noRenewal, \"norenewal\"],\n    [\"CRM Record Under 70% Complete\", incomplete, \"incomplete\"]\n  ];\n  for (const [title, list, id] of lists) {\n    const filtered = filterAccounts(list);\n    html += '<div class=\"card\"><div class=\"card-head\"><h2>' + esc(title) + \"</h2>\"\n      + \"<p>\" + filtered.length + \" account\" + (filtered.length === 1 ? \"\" : \"s\") + \"</p></div>\"\n      + '<div class=\"card-body flush\">'\n      + buildTable(id, accountCols(), filtered, {\n          defaultSort: { key: \"days\", dir: -1 },\n          empty: \"Nothing flagged. \"\n        })\n      + \"</div></div>\";\n  }\n\n  // Overdue tasks.\n  const q = state.q.trim().toLowerCase();\n  const overdueFiltered = q\n    ? overdue.filter(t => String(t.companyName || \"\").toLowerCase().includes(q))\n    : overdue;\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Overdue Tasks</h2>'\n    + \"<p>\" + overdueFiltered.length + \" open tasks past their due date</p></div>\"\n    + '<div class=\"card-body flush\">'\n    + buildTable(\"overdue\", [\n        { key: \"subject\", label: \"Task\", align: \"l\", cls: \"name\", render: r => esc(r.subject) },\n        { key: \"companyName\", label: \"Client\", align: \"l\",\n          render: r => esc(r.companyName || \"(not linked to a client)\") },\n        { key: \"am\", label: \"Owner\", align: \"l\",\n          value: r => (AM_BY_ID.get(r.amId) || {}).name || \"\",\n          render: r => esc((AM_BY_ID.get(r.amId) || {}).name || \"\u2014\") },\n        { key: \"due\", label: \"Due\", align: \"l\", render: r => esc(r.due) },\n        { key: \"daysOverdue\", label: \"Days overdue\", render: r => agePill(r.daysOverdue) },\n        { key: \"priority\", label: \"Priority\", align: \"l\",\n          render: r => r.priority ? '<span class=\"pill plain\">' + esc(r.priority) + \"</span>\" : \"\u2014\" }\n      ], overdueFiltered, { defaultSort: { key: \"daysOverdue\", dir: -1 }, empty: \"No overdue tasks.\" })\n    + \"</div></div>\";\n\n  // Booked meetings. Not an exception -- the opposite -- but this is where a\n  // manager looks, and \"who has client time on the calendar\" is worth knowing.\n  const upcoming = (DATA.upcomingMeetings || []).filter(u => {\n    if (state.am !== \"all\" && u.amId !== state.am) return false;\n    const q = state.q.trim().toLowerCase();\n    return !q || String(u.companyName).toLowerCase().includes(q);\n  });\n  if (upcoming.length) {\n    html += '<div class=\"card\"><div class=\"card-head\"><h2>Upcoming Client Meetings ('\n      + upcoming.length + \")</h2>\"\n      + \"<p>On the calendar but not yet held, so they do not score. They will count \"\n      + \"automatically once the date passes.</p></div>\"\n      + '<div class=\"card-body flush\">'\n      + buildTable(\"upcoming\", [\n          { key: \"date\", label: \"Date\", align: \"l\", render: u => esc(u.date) },\n          { key: \"companyName\", label: \"Client\", align: \"l\", cls: \"name\",\n            render: u => esc(u.companyName) },\n          { key: \"am\", label: \"Account Manager\", align: \"l\",\n            value: u => (AM_BY_ID.get(u.amId) || {}).name || \"\",\n            render: u => esc((AM_BY_ID.get(u.amId) || {}).name || \"\u2014\") },\n          { key: \"title\", label: \"Meeting\", align: \"l\", cls: \"wrap\", nosort: true,\n            render: u => '<span class=\"muted\">' + esc(u.title) + \"</span>\" }\n        ], upcoming, { defaultSort: { key: \"date\", dir: 1 } })\n      + \"</div></div>\";\n  }\n\n  // Client satisfaction detractors. Deliberately NOT limited to the selected\n  // period -- an unhappy client is worth seeing whenever they said so.\n  const detractors = (DATA.surveyDetractors || []).filter(dt => {\n    if (state.am !== \"all\" && dt.amId !== state.am) return false;\n    const q = state.q.trim().toLowerCase();\n    return !q || String(dt.companyName).toLowerCase().includes(q);\n  });\n  if (detractors.length) {\n    html += '<div class=\"card\"><div class=\"card-head\"><h2>Unhappy Clients ('\n      + detractors.length + \")</h2>\"\n      + \"<p>NPS at or below \" + (CFG.surveyRules?.nps_detractor_max ?? 6)\n      + \", or CSAT at or below \" + (CFG.surveyRules?.csat_negative_max ?? 2)\n      + \". Shown regardless of date \u2014 a detractor from last year is still worth \"\n      + \"knowing about. Check the date before acting on it.</p></div>\"\n      + '<div class=\"card-body flush\">'\n      + buildTable(\"detractors\", [\n          { key: \"companyName\", label: \"Client\", align: \"l\", cls: \"name\",\n            render: dt => esc(dt.companyName) },\n          { key: \"am\", label: \"Account Manager\", align: \"l\",\n            value: dt => (AM_BY_ID.get(dt.amId) || {}).name || \"\",\n            render: dt => esc((AM_BY_ID.get(dt.amId) || {}).name || \"(off roster)\") },\n          { key: \"type\", label: \"Survey\", align: \"l\", render: dt => esc(dt.type) },\n          { key: \"rating\", label: \"Score\",\n            render: dt => '<span class=\"pill crit\">' + dt.rating + \"/\" + dt.scale + \"</span>\" },\n          { key: \"date\", label: \"Date\", align: \"l\", render: dt => esc(dt.date || \"\u2014\") },\n          { key: \"contact\", label: \"Respondent\", align: \"l\", render: dt => esc(dt.contact) },\n          { key: \"comment\", label: \"Comment\", align: \"l\", cls: \"wrap\", nosort: true,\n            render: dt => dt.comment\n              ? '<span class=\"muted\">' + esc(dt.comment) + \"</span>\" : \"\u2014\" }\n        ], detractors, { defaultSort: { key: \"date\", dir: -1 } })\n      + \"</div></div>\";\n  }\n\n  // Two separate problems: owned by nobody, versus owned by someone off the board.\n  const unowned = DATA.unownedAccounts || [];\n  if (unowned.length) {\n    html += '<div class=\"card\"><div class=\"card-head\"><h2>Accounts With No Owner ('\n      + unowned.length + \")</h2>\"\n      + \"<p>Active client accounts with no Company owner set. They count toward \"\n      + \"nobody's coverage, which means nobody is accountable for them.</p></div>\"\n      + '<div class=\"card-body\">'\n      + unowned.map(a => '<span class=\"chip miss\" title=\"'\n          + esc(a.days == null ? \"no logged activity\" : a.days + \" days since activity\")\n          + '\">' + esc(a.name) + \"</span>\").join(\"\")\n      + \"</div></div>\";\n  }\n\n  const offRoster = DATA.offRosterAccounts || [];\n  if (offRoster.length) {\n    const byOwner = {};\n    for (const a of offRoster) (byOwner[a.owner] = byOwner[a.owner] || []).push(a);\n    html += '<div class=\"card\"><div class=\"card-head\">'\n      + \"<h2>Owned By Someone Not On The AM Roster (\" + offRoster.length + \")</h2>\"\n      + \"<p>Real client accounts whose owner is not competing \u2014 ops, sales, or \"\n      + \"someone who has left. They are excluded from every AM's coverage, so they \"\n      + \"are shown here rather than disappearing.</p></div>\"\n      + '<div class=\"card-body flush\">'\n      + buildTable(\"offroster\", [\n          { key: \"name\", label: \"Client\", align: \"l\", cls: \"name\",\n            render: a => esc(a.name) },\n          { key: \"owner\", label: \"Owner\", align: \"l\", render: a => esc(a.owner) },\n          { key: \"days\", label: \"Days since activity\", value: a => a.days ?? 9999,\n            render: a => agePill(a.days) },\n          { key: \"completeness\", label: \"CRM complete\",\n            render: a => meter(a.completeness, \"var(--cat-hyg)\") }\n        ], offRoster.filter(a => {\n          const q = state.q.trim().toLowerCase();\n          return !q || String(a.name).toLowerCase().includes(q);\n        }), { defaultSort: { key: \"days\", dir: -1 } })\n      + \"</div></div>\";\n  }\n\n  return html;\n}\n\n/* ============================================================\n   SECTION 7 \u2014 RECOGNITION\n   ============================================================ */\nfunction renderRecognition() {\n  const rows = currentRows();\n  if (!rows.length) return '<div class=\"card\"><div class=\"empty\">No AMs in scope.</div></div>';\n\n  const [pFrom, pTo] = priorRange();\n  const prior = scoreRows(aggregate(pFrom, pTo, amIdsInScope()).rows);\n  const priorById = new Map(prior.map(r => [r.amId, r]));\n\n  // An award requires the metric to be ABOVE ZERO. Without this, reduce() simply\n  // returns the first row when everyone scores nothing -- which named the\n  // top-ranked AM as \"Task Crusher\" on 0 tasks completed. An award nobody earned\n  // must go unawarded, not default to whoever sorts first.\n  const best = (fn, min) => {\n    const ranked = rows.filter(r => !r.unranked);\n    const pool = ranked.length ? ranked : rows;\n    const floor = min == null ? 0 : min;\n    const eligible = pool.filter(r => {\n      const v = fn(r);\n      return typeof v === \"number\" && isFinite(v) && v > floor;\n    });\n    if (!eligible.length) return null;\n    return eligible.reduce((a, b) => fn(b) > fn(a) ? b : a);\n  };\n\n  // Most Improved compares each AM against their own prior period, on the\n  // per-account engagement rate -- not the relative index, which moves when\n  // anyone else's numbers move.\n  let improved = null, improvedDelta = 0, comparable = 0;\n  for (const r of rows) {\n    const p = priorById.get(r.amId);\n    if (!p || p.engPerAccount <= 0) continue;\n    comparable++;\n    const delta = r.engPerAccount - p.engPerAccount;\n    if (delta > improvedDelta) { improvedDelta = delta; improved = r; }\n  }\n  const improvedEmpty = comparable === 0\n    ? \"No activity in the prior period (\" + pFrom + \" to \" + pTo + \") to compare against.\"\n    : \"No AM increased their engagement per account versus \" + pFrom + \" to \" + pTo + \".\";\n\n  const awards = [\n    [\"\ud83c\udfc6 Overall Leader\", best(r => r.score),\n      r => n1(r.score) + \" AM Score \u00b7 \" + pct(r.coveragePct) + \" coverage\",\n      \"No AM scored above zero in this period.\"],\n    [\"\ud83d\udcde Most Client Conversations\", best(r => r.counts.meeting + r.counts.call),\n      r => (r.counts.meeting + r.counts.call) + \" meetings and calls \u00b7 \"\n        + n1((r.counts.meeting + r.counts.call) / Math.max(r.assigned, 1)) + \" per account\",\n      \"No meetings or calls were logged by a competing AM in this period.\"],\n    [\"\ud83d\udcc5 Most Meetings\", best(r => r.counts.meeting),\n      r => r.counts.meeting + \" meetings logged\",\n      \"No meetings were logged by a competing AM in this period.\"],\n    [\"\ud83e\uddf9 CRM Hygiene Champion\", best(r => r.hygPts),\n      r => n1(r.hygPts) + \" points of field updates \u00b7 \" + pct(r.completeness) + \" complete\",\n      \"No competing AM updated a tracked field in this period.\"],\n    [\"\ud83d\udcc6 Habitual HubSpotter\", best(r => r.daysWorked),\n      r => r.daysWorked + \" separate days working in HubSpot\"\n        + (r.activities ? \" \u00b7 \" + n0(r.activities) + \" activities\" : \"\"),\n      \"No competing AM logged anything against a client account.\"],\n    [\"\ud83d\udcda Best Account Coverage\", best(r => r.coveragePct),\n      r => pct(r.coveragePct) + \" \u00b7 \" + r.touched + \" of \" + r.assigned + \" accounts\",\n      \"No competing AM touched an account in this period.\"],\n    [\"\ud83d\udd25 Most Improved\", improved,\n      r => \"+\" + n1(improvedDelta) + \" engagement points per account vs \"\n        + esc(pFrom) + \" to \" + esc(pTo), improvedEmpty],\n    [\"\u2705 Task Crusher\", best(r => r.counts.task_completed),\n      r => r.counts.task_completed + \" tasks completed\",\n      \"No competing AM completed a HubSpot task in this period.\"]\n    // \"Most Complete Book of Business\" removed 2026-08-12. It could be won by\n    // inheriting a well-kept book rather than by doing anything, so it rewarded a\n    // starting position instead of behaviour. Completeness is still visible in the\n    // Standings column, the CRM Hygiene tab, and on the Hygiene Champion card.\n  ];\n\n  let html = '<div class=\"card\"><div class=\"card-head\"><h2>Recognition</h2>'\n    + \"<p>Awards are drawn from the same filtered period as the standings. Every one \"\n    + \"rewards either a real client conversation, portfolio reach, or an accurate record \"\n    + \"\u2014 none of them can be won by logging filler.</p></div><div class=\\\"card-body\\\">\"\n    + '<div class=\"awards\">';\n  for (const [title, winner, detail, emptyReason] of awards) {\n    if (!winner) {\n      html += '<div class=\"award none\"><div class=\"t\">' + title + \"</div>\"\n        + '<div class=\"w\">Not awarded</div>'\n        + '<div class=\"d\">' + esc(emptyReason\n            || \"No qualifying activity in this period.\") + \"</div></div>\";\n      continue;\n    }\n    html += '<div class=\"award\"><div class=\"t\">' + title + \"</div>\"\n      + '<div class=\"w\">' + esc(winner.am.name) + \"</div>\"\n      + '<div class=\"d\">' + detail(winner) + \"</div></div>\";\n  }\n  html += \"</div></div></div>\";\n  return html;\n}\n\n/* ============================================================\n   ANNUAL RACE\n   ============================================================ */\nconst MONTH_ABBR = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\n\nfunction monthBounds(ym) {\n  const [y, m] = ym.split(\"-\").map(Number);\n  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();\n  return [ym + \"-01\", ym + \"-\" + String(last).padStart(2, \"0\")];\n}\n\nfunction annualRace(year) {\n  const A = CFG.annual || {};\n  const minMonths = (A.gate_overrides || {})[String(year)] ?? (A.min_qualifying_months ?? 6);\n  const minBook = A.min_book_for_qualifying_month ?? 8;\n  const rookieMin = A.rookie_min_months ?? 3;\n  const topN = A.consistency_top_n ?? 3;\n\n  const amIds = amIdsInScope();\n  const months = (DATA.months || []).filter(m => m.startsWith(String(year)));\n  const byAm = new Map(amIds.map(id => [id, {\n    am: AM_BY_ID.get(id) || { id, name: \"Owner \" + id, team: \"Unassigned\" },\n    amId: id, months: {}, qualifying: [], topFinishes: 0\n  }]));\n\n  const syncDate = ymd(today());\n  for (const ym of months) {\n    const [from, to] = monthBounds(ym);\n    // Targets are monthly, so a month still in progress cannot be measured\n    // against them -- 10 days of work against a 30-day target reads as a slump\n    // that isn't real. Show it, but keep it out of the average.\n    const complete = to <= syncDate;\n    const rows = scoreRows(aggregate(from, to, amIds, ym).rows, \"absolute\");\n    for (const r of rows) {\n      const book = (DATA.bookByMonth[r.amId] || {})[ym];\n      const bookSize = book == null ? r.assigned : book;\n      const bigEnough = bookSize >= minBook;\n      const qualifies = bigEnough && complete;\n      const rec = byAm.get(r.amId);\n      rec.months[ym] = {\n        score: r.score, book: bookSize, qualifies, rank: r.rank,\n        inProgress: !complete, bookTooSmall: !bigEnough,\n        coveragePct: r.coveragePct, completeness: r.completeness,\n        activities: r.activities\n      };\n      if (qualifies) {\n        rec.qualifying.push(r.score);\n        if (r.rank && r.rank <= topN) rec.topFinishes++;\n      }\n    }\n  }\n\n  const out = [...byAm.values()].map(rec => {\n    const n = rec.qualifying.length;\n    const mean = n ? rec.qualifying.reduce((a, b) => a + b, 0) / n : 0;\n    const variance = n > 1\n      ? rec.qualifying.reduce((s, v) => s + (v - mean) ** 2, 0) / (n - 1) : 0;\n    return Object.assign(rec, {\n      qualifyingMonths: n,\n      annualScore: mean,\n      spread: Math.sqrt(variance),\n      best: n ? Math.max(...rec.qualifying) : 0,\n      worst: n ? Math.min(...rec.qualifying) : 0,\n      eligible: n >= minMonths,\n      rookieEligible: n >= rookieMin && n < minMonths\n    });\n  });\n\n  out.sort((a, b) => b.annualScore - a.annualScore);\n  const eligible = out.filter(r => r.eligible);\n  eligible.forEach((r, i) => { r.annualRank = i + 1; });\n  const rookies = out.filter(r => r.rookieEligible);\n  rookies.forEach((r, i) => { r.rookieRank = i + 1; });\n\n  return {\n    rows: out, months, eligible, rookies, minMonths, minBook, rookieMin, topN,\n    // Months that could possibly exist for this year given the data window.\n    monthsAvailable: months.length,\n    gateOverridden: (A.gate_overrides || {})[String(year)] != null,\n    seasonLabel: (A.season_labels || {})[String(year)] || null\n  };\n}\n\nfunction availableYears() {\n  const years = [...new Set((DATA.months || []).map(m => m.slice(0, 4)))].sort().reverse();\n  return years.length ? years : [String(today().getUTCFullYear())];\n}\n\nfunction renderAnnual() {\n  const year = state.year || availableYears()[0];\n  const R = annualRace(year);\n  const T = CFG.absoluteTargets || {};\n  let html = \"\";\n\n  if (!T.CALIBRATED) {\n    html += '<div class=\"notice\"><div><span class=\"headline\">Absolute targets are not calibrated yet.</span>'\n      + \"The annual score is measured against fixed monthly targets rather than \"\n      + \"against each other, because relative scores cannot be fairly averaged \"\n      + \"across a year. Those targets are currently placeholders: \"\n      + \"<b>\" + (T.engagement_points_per_account ?? \"\u2014\") + \"</b> engagement points \"\n      + \"per account, <b>\" + (T.engagement_points_total ?? \"\u2014\") + \"</b> total, \"\n      + \"<b>\" + (T.management_points ?? \"\u2014\") + \"</b> management, \"\n      + \"<b>\" + (T.hygiene_points ?? \"\u2014\") + \"</b> hygiene \u2014 per month. After a full \"\n      + \"month of real data, set each near what a strong AM actually achieves \"\n      + \"(roughly the 75th-80th percentile) in <code>config.py</code>, then set \"\n      + \"<code>CALIBRATED: True</code>. Until then treat the ordering as \"\n      + \"indicative and the absolute numbers as meaningless.\"\n      + \"</div></div>\";\n  }\n  // The gate can be mathematically unreachable in a launch year.\n  if (R.monthsAvailable < R.minMonths) {\n    html += '<div class=\"notice\"><div>'\n      + '<span class=\"headline\">No ' + esc(year) + \" award is reachable: only \"\n      + R.monthsAvailable + \" month\" + (R.monthsAvailable === 1 ? \"\" : \"s\")\n      + \" of data exist against a \" + R.minMonths + \"-month gate.</span>\"\n      + (PROGRAM_START\n          ? \"The competition began <b>\" + esc(PROGRAM_START) + \"</b>, so \"\n            + esc(year) + \" can never contain \" + R.minMonths + \" qualifying months. \"\n          : \"\")\n      + \"Either lower the gate for this year via \"\n      + \"<code>ANNUAL[\\\"gate_overrides\\\"] = {\\\"\" + esc(year) + \"\\\": \"\n      + Math.max(2, R.monthsAvailable - 1) + \"}</code> and name it a launch season, \"\n      + \"or treat \" + esc(year) + \" as a pilot and let the first full award run in \"\n      + (Number(year) + 1) + \". Monthly standings and every other tab work normally \"\n      + \"either way \u2014 this only affects the annual trophy.\"\n      + \"</div></div>\";\n  } else if (R.gateOverridden) {\n    html += '<div class=\"notice\"><div>'\n      + '<span class=\"headline\">' + esc(year) + \" uses a reduced \"\n      + R.minMonths + \"-month gate.</span>\"\n      + \"A shortened season, so eligibility was lowered from the standard \"\n      + (CFG.annual.min_qualifying_months ?? 6) + \" months. Scores are still \"\n      + \"monthly averages and remain comparable to other years; only who is \"\n      + \"eligible changed.\"\n      + \"</div></div>\";\n  }\n\n  if (!DATA.capabilities.ownerHistory) {\n    html += '<div class=\"notice\"><div><span class=\"headline\">Owner history unavailable.</span>'\n      + \"Each AM's book size is assumed to have been today's size all year, so an \"\n      + \"AM whose book grew mid-year is judged against their current book. \"\n      + \"Re-run <code>sync.py</code> without <code>--skip-history</code> to fix.\"\n      + \"</div></div>\";\n  }\n\n  // Awards.\n  const champion = R.eligible[0] || null;\n  const rookie = R.rookies[0] || null;\n  const consistent = R.eligible.slice().sort(\n    (a, b) => (b.topFinishes - a.topFinishes) || (a.spread - b.spread))[0] || null;\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>'\n    + esc(R.seasonLabel || (year + \" Annual Award\"))\n    + \"</h2><p>Mean of qualifying monthly scores \u2014 never the sum, \"\n    + \"which would just reward whoever was employed longest</p></div>\"\n    + '<div class=\"card-body\"><div class=\"awards\">';\n  html += champion\n    ? '<div class=\"award\"><div class=\"t\">\ud83c\udfc6 Account Manager of the Year</div>'\n      + '<div class=\"w\">' + esc(champion.am.name) + \"</div>\"\n      + '<div class=\"d\">' + n1(champion.annualScore) + \" average across \"\n      + champion.qualifyingMonths + \" qualifying months</div></div>\"\n    : '<div class=\"award none\"><div class=\"t\">\ud83c\udfc6 Account Manager of the Year</div>'\n      + '<div class=\"w\">Not awarded</div><div class=\"d\">Nobody has reached '\n      + R.minMonths + \" qualifying months in \" + esc(year) + \" yet.</div></div>\";\n  html += rookie\n    ? '<div class=\"award\"><div class=\"t\">\ud83c\udf31 Rookie of the Year</div>'\n      + '<div class=\"w\">' + esc(rookie.am.name) + \"</div>\"\n      + '<div class=\"d\">' + n1(rookie.annualScore) + \" average across \"\n      + rookie.qualifyingMonths + \" months \u2014 below the \" + R.minMonths\n      + \"-month gate for the main award</div></div>\"\n    : '<div class=\"award none\"><div class=\"t\">\ud83c\udf31 Rookie of the Year</div>'\n      + '<div class=\"w\">Not awarded</div><div class=\"d\">No AM sits between '\n      + R.rookieMin + \" and \" + (R.minMonths - 1) + \" qualifying months.</div></div>\";\n  html += consistent\n    ? '<div class=\"award\"><div class=\"t\">\u2693 Most Consistent</div>'\n      + '<div class=\"w\">' + esc(consistent.am.name) + \"</div>\"\n      + '<div class=\"d\">' + consistent.topFinishes + \" top-\" + R.topN\n      + \" finishes \u00b7 \u00b1\" + n1(consistent.spread) + \" month-to-month</div></div>\"\n    : '<div class=\"award none\"><div class=\"t\">\u2693 Most Consistent</div>'\n      + '<div class=\"w\">Not awarded</div><div class=\"d\">No eligible AMs.</div></div>';\n  html += \"</div></div></div>\";\n\n  // Month-by-month grid.\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Month by Month</h2>'\n    + \"<p>Each cell is that month's score against absolute targets. Grey means the \"\n    + \"month does not count \u2014 either fewer than \" + R.minBook\n    + \" accounts held, or the month is still in progress (dashed, marked *) and \"\n    + \"cannot be judged against a monthly target yet. Hover any cell for detail.</p></div>\"\n    + '<div class=\"card-body flush\"><div class=\"tablewrap\"><table><thead><tr>'\n    + '<th class=\"l\">Account Manager</th>'\n    + R.months.map(m => \"<th>\" + MONTH_ABBR[Number(m.slice(5, 7)) - 1] + \"</th>\").join(\"\")\n    + \"<th>Qual. months</th><th>Annual score</th><th>Status</th></tr></thead><tbody>\";\n\n  const maxAnnual = Math.max(...R.rows.map(r => r.annualScore), 1);\n  for (const r of R.rows) {\n    const cls = r.eligible && r.annualRank <= 3 ? \"top\" + r.annualRank : \"\";\n    html += \"<tr\" + (cls ? ' class=\"' + cls + '\"' : \"\") + \">\";\n    html += '<td class=\"l name\">'\n      + (r.eligible && r.annualRank ? '<span class=\"rank-cell\">' + r.annualRank + \"</span> \" : \"\")\n      + esc(r.am.name) + \"</td>\";\n    for (const ym of R.months) {\n      const cell = r.months[ym];\n      if (!cell) { html += '<td class=\"muted\">\u2014</td>'; continue; }\n      const shade = Math.max(0, Math.min(1, cell.score / 100));\n      const bg = cell.qualifies\n        ? \"color-mix(in srgb, var(--cat-eng) \" + Math.round(shade * 78) + \"%, transparent)\"\n        : \"var(--hairline-2)\";\n      const ink = cell.qualifies && shade > 0.55 ? \"#fff\" : \"var(--ink)\";\n      const why = cell.inProgress\n        ? \" \u00b7 MONTH IN PROGRESS \u2014 shown but excluded from the average\"\n        : cell.bookTooSmall\n          ? \" \u00b7 DOES NOT QUALIFY (book under \" + R.minBook + \")\"\n          : \"\";\n      html += '<td style=\"padding:4px\"><div title=\"'\n        + esc(ym + \" \u00b7 score \" + cell.score.toFixed(1) + \" \u00b7 rank \" + (cell.rank || \"n/a\")\n              + \" \u00b7 \" + cell.book + \" accounts \u00b7 \" + Math.round(cell.coveragePct)\n              + \"% coverage \u00b7 \" + cell.activities + \" activities\" + why)\n        + '\" style=\"background:' + bg + \";color:\" + ink\n        + ';border-radius:5px;padding:5px 2px;font-weight:650;'\n        + (cell.qualifies ? \"\" : \"opacity:.6;\")\n        + (cell.inProgress ? \"border:1px dashed var(--ink-3);\" : \"\") + '\">'\n        + n0(cell.score) + (cell.inProgress ? \"*\" : \"\") + \"</div></td>\";\n    }\n    html += \"<td><b>\" + r.qualifyingMonths + \"</b></td>\";\n    html += '<td class=\"score-cell\">' + (r.qualifyingMonths ? n1(r.annualScore) : \"\u2014\") + \"</td>\";\n    html += \"<td>\" + (r.eligible\n        ? '<span class=\"pill good\">eligible</span>'\n        : r.rookieEligible\n          ? '<span class=\"pill warn\">rookie</span>'\n          : '<span class=\"pill plain\">' + r.qualifyingMonths + \"/\" + R.minMonths + \"</span>\")\n      + \"</td></tr>\";\n  }\n  html += \"</tbody></table></div></div></div>\";\n\n  // Standings detail.\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Ann

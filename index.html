>Annual</span>'\n            : r.rookieEligible ? '<span class=\"pill warn\">Rookie</span>'\n            : '<span class=\"pill plain\">Not eligible</span>' }\n      ], R.rows, { defaultSort: { key: \"annualScore\", dir: -1 }, onRowAm: r => r.amId })\n    + \"</div></div>\";\n\n  html += '<details class=\"method\"><summary>How the annual winner is decided</summary>'\n    + '<div class=\"method-body\">'\n    + \"<h4>Mean, not total</h4>\"\n    + \"<p>An AM's annual score is the <b>average</b> of their qualifying monthly \"\n    + \"scores. A running total would hand the award to whoever was employed \"\n    + \"longest, which is exactly the problem this is built to avoid \u2014 an AM who \"\n    + \"joined in June can win.</p>\"\n    + \"<h4>Absolute targets, not a relative race</h4>\"\n    + \"<p>The monthly leaderboard scores each category against the best performer \"\n    + \"in view. That is fine as a snapshot but cannot be averaged over a year: it \"\n    + \"is zero-sum, so your score falls when a colleague improves, a weak month \"\n    + \"outscores a strong one, and if the whole team improves nobody moves. The \"\n    + \"annual score therefore measures each month against fixed targets, so a 74 \"\n    + \"in March means the same as a 74 in October.</p>\"\n    + \"<h4>What makes a month qualify</h4>\"\n    + \"<p>The AM must have held at least <b>\" + R.minBook + \" accounts</b> that \"\n    + \"month, reconstructed from HubSpot owner history rather than assumed from \"\n    + \"today's book. A ramp-up month with three clients neither drags an average \"\n    + \"down nor lets a tiny book farm an easy 100.</p>\"\n    + \"<h4>Eligibility</h4>\"\n    + \"<p><b>\" + R.minMonths + \" qualifying months</b> for the main award. Fewer \"\n    + \"months than that is too small a sample \u2014 two lucky months should not beat \"\n    + \"eleven consistent ones. Anyone with \" + R.rookieMin + \" to \"\n    + (R.minMonths - 1) + \" qualifying months competes for <b>Rookie of the \"\n    + \"Year</b> instead, so a mid-year hire still has something real to win.</p>\"\n    + \"<h4>Why book size does not decide it</h4>\"\n    + \"<p>Two of the three categories are percentages already (Coverage and CRM \"\n    + \"Completeness), and Engagement is \"\n    + Math.round((CFG.engagementSubweights.per_account_rate || 0.7) * 100)\n    + \"% per-account rate against only \"\n    + Math.round((CFG.engagementSubweights.absolute_volume || 0.3) * 100)\n    + \"% raw volume. That volume slice is deliberate \u2014 an AM with 27 clients does \"\n    + \"genuinely do more work than one with 12 \u2014 but it is the only place a larger \"\n    + \"book helps. Lower <code>ENGAGEMENT_SUBWEIGHTS.absolute_volume</code> to make \"\n    + \"the award fully size-neutral.</p>\"\n    + \"<h4>Tiebreaker</h4>\"\n    + \"<p>Months finishing in the top \" + R.topN + \", then the smaller spread. Both \"\n    + \"reward sustained management over a single strong quarter.</p>\"\n    + \"<h4>Limitation</h4>\"\n    + \"<p>CRM Completeness is measured at last sync, not as of each month end, so \"\n    + \"the hygiene half of every historical month reflects today's record quality. \"\n    + \"Coverage and engagement are period-correct. Fixing completeness needs a \"\n    + \"stored snapshot per sync.</p>\"\n    + \"</div></details>\";\n\n  return html;\n}\n\n/* ============================================================\n   DRILL-DOWN\n   ============================================================ */\nfunction openDrawer(amId) {\n  const rows = currentRows();\n  const r = rows.find(x => x.amId === amId);\n  if (!r) return;\n  state.openAm = amId;\n  const [from, to] = activeRange();\n\n  document.getElementById(\"drawerName\").textContent = r.am.name;\n  document.getElementById(\"drawerSub\").textContent =\n    (r.rank ? \"Rank \" + r.rank + \" of \" + rows.filter(x => x.rank).length\n            : r.notCompeting\n                ? \"On the roster but not competing\"\n                : \"Not ranked (book under \" + minBookFor(r.amId) + \" accounts)\")\n    + (HAS_TEAMS ? \" \u00b7 \" + r.am.team : \"\")\n    + \" \u00b7 \" + from + \" to \" + to;\n\n  const untouched = r.assignedAccounts.filter(a => !r.touchedIds.has(a.id));\n  const quiet = r.assignedAccounts.filter(\n    a => a.daysSinceActivity == null || a.daysSinceActivity >= 30\n  ).sort((a, b) => (b.daysSinceActivity ?? 9999) - (a.daysSinceActivity ?? 9999));\n  const overdue = (DATA.overdueTasks || []).filter(t => t.amId === amId);\n  const worst = r.assignedAccounts.slice().sort((a, b) => a.completeness - b.completeness);\n\n  // \"What to work on next\" \u2014 ordered by how much it moves the score.\n  const actions = [];\n  if (untouched.length) {\n    actions.push(\"Reach out to <b>\" + untouched.length + \" untouched account\"\n      + (untouched.length === 1 ? \"\" : \"s\") + \"</b> \u2014 each one is worth \"\n      + CFG.coveragePoints.unique_account_touched\n      + \" coverage points and lifts coverage to \" + pct(100 * (r.touched + untouched.length) / Math.max(r.assigned, 1))\n      + \". Start with \" + untouched.slice(0, 3).map(a => esc(a.name)).join(\", \") + \".\");\n  }\n  const quiet60 = quiet.filter(a => a.daysSinceActivity == null || a.daysSinceActivity >= 60);\n  if (quiet60.length) {\n    actions.push(\"<b>\" + quiet60.length + \" account\" + (quiet60.length === 1 ? \"\" : \"s\")\n      + \" have been quiet 60+ days</b> \u2014 these are the churn risks: \"\n      + quiet60.slice(0, 3).map(a => esc(a.name)).join(\", \") + \".\");\n  }\n  const gapCounts = {};\n  for (const a of r.assignedAccounts) for (const m of a.missing) gapCounts[m] = (gapCounts[m] || 0) + 1;\n  const topGap = Object.entries(gapCounts).sort((a, b) => b[1] - a[1])[0];\n  if (topGap) {\n    actions.push(\"Fill in <b>\" + esc(CHECK_LABELS[topGap[0]] || topGap[0]) + \"</b> on \"\n      + topGap[1] + \" account\" + (topGap[1] === 1 ? \"\" : \"s\")\n      + \" \u2014 the single biggest gap in this book.\");\n  }\n  if (overdue.length) {\n    actions.push(\"Clear <b>\" + overdue.length + \" overdue task\"\n      + (overdue.length === 1 ? \"\" : \"s\") + \"</b>, oldest \"\n      + Math.max(...overdue.map(t => t.daysOverdue)) + \" days past due\"\n      + (r.counts.task_overdue\n          ? \" \u2014 \" + r.counts.task_overdue + \" of them already cost \"\n            + n1(Math.abs(r.counts.task_overdue * CFG.incompleteTaskPenalty))\n            + \" points this period\"\n          : \"\") + \".\");\n  }\n  if (!actions.length) actions.push(\"Nothing flagged. This book is covered and the records are complete.\");\n\n  let html = \"\";\n\n  html += '<div class=\"card\"><div class=\"card-body\"><div class=\"tiles\">'\n    + tile(\"AM Score\", n1(r.score),\n        r.rank ? \"rank \" + r.rank + \" of \" + rows.filter(x => x.rank).length\n               : (r.notCompeting ? \"not competing\" : \"not ranked - small book\"))\n    + tile(\"Coverage\", pct(r.coveragePct), r.touched + \" of \" + r.assigned + \" accounts\")\n    + tile(\"CRM Complete\", pct(r.completeness), \"across the whole book\")\n    + tile(\"Engagement\", n1(r.engagementScore), \"0-100 component\")\n    + tile(\"Coverage score\", n1(r.coverageScore), \"0-100 component\")\n    + tile(\"Hygiene score\", n1(r.hygieneScore), \"0-100 component\")\n    + tile(\"Total activities\", n0(r.activities), n1(r.actPerAccount) + \" per account\")\n    + tile(\"Tasks completed\", n0(r.counts.task_completed),\n        overdue.length ? overdue.length + \" still overdue\" : \"none overdue\")\n    + tile(\"Missed tasks\", n0(r.counts.task_overdue),\n        r.counts.task_overdue\n          ? n1(r.counts.task_overdue * CFG.incompleteTaskPenalty) + \" points this period\"\n          : \"no penalty this period\",\n        r.counts.task_overdue > 0)\n    + \"</div></div></div>\";\n\n  html += '<div class=\"nextup\"><h3>What to work on next</h3><ol>'\n    + actions.map(a => \"<li>\" + a + \"</li>\").join(\"\") + \"</ol></div>\";\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Accounts Not Touched ('\n    + untouched.length + \")</h2><p>No \" + touchPhrase() + \" this period</p></div>\"\n    + '<div class=\"card-body flush\">'\n    + buildTable(\"dUntouched\", accountCols().slice(0, 6),\n        untouched.map(a => ({ acc: a, am: r.am })),\n        { defaultSort: { key: \"days\", dir: -1 }, empty: \"Full coverage this period.\" })\n    + \"</div></div>\";\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Accounts Needing Attention</h2>'\n    + \"<p>Quiet 30+ days, worst first</p></div><div class=\\\"card-body flush\\\">\"\n    + buildTable(\"dQuiet\", accountCols().slice(0, 6), quiet.map(a => ({ acc: a, am: r.am })),\n        { defaultSort: { key: \"days\", dir: -1 }, empty: \"Nothing quiet for 30+ days.\" })\n    + \"</div></div>\";\n\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Least Complete Records</h2>'\n    + \"<p>Lowest CRM completeness in this book, with the specific gaps</p></div>\"\n    + '<div class=\"card-body flush\">'\n    + buildTable(\"dIncomplete\", accountCols(true), worst.slice(0, 25).map(a => ({ acc: a, am: r.am })),\n        { defaultSort: { key: \"complete\", dir: 1 }, empty: \"No accounts assigned.\" })\n    + \"</div></div>\";\n\n  if (overdue.length) {\n    html += '<div class=\"card\"><div class=\"card-head\"><h2>Overdue Tasks</h2></div>'\n      + '<div class=\"card-body flush\">'\n      + buildTable(\"dOverdue\", [\n          { key: \"subject\", label: \"Task\", align: \"l\", cls: \"name\", render: t => esc(t.subject) },\n          { key: \"companyName\", label: \"Client\", align: \"l\",\n            render: t => esc(t.companyName || \"(not linked)\") },\n          { key: \"due\", label: \"Due\", align: \"l\", render: t => esc(t.due) },\n          { key: \"daysOverdue\", label: \"Days overdue\", render: t => agePill(t.daysOverdue) }\n        ], overdue, { defaultSort: { key: \"daysOverdue\", dir: -1 } })\n      + \"</div></div>\";\n  }\n\n  const recent = r.events.slice().sort((a, b) => b.d.localeCompare(a.d)).slice(0, 40);\n  html += '<div class=\"card\"><div class=\"card-head\"><h2>Recent Scoring Activity</h2>'\n    + \"<p>The 40 most recent events that earned points, and what each was worth</p></div>\"\n    + '<div class=\"card-body flush\"><div class=\"tablewrap\"><table><thead><tr>'\n    + '<th class=\"l\">Date</th><th class=\"l\">Type</th><th class=\"l\">Client</th>'\n    + '<th class=\"l\">Detail</th><th>Points</th></tr></thead><tbody>';\n  if (!recent.length) {\n    html += '<tr><td colspan=\"5\" class=\"empty\">No scoring activity in this period.</td></tr>';\n  }\n  for (const e of recent) {\n    const acc = ACC_BY_ID.get(e.co);\n    html += '<tr><td class=\"l\">' + esc(e.d) + '</td><td class=\"l\">'\n      + '<span class=\"pill plain\">' + esc(e.t.replace(/_/g, \" \")) + \"</span></td>\"\n      + '<td class=\"l\">' + esc(acc ? acc.name : e.co) + \"</td>\"\n      + '<td class=\"l muted\" style=\"max-width:320px;overflow:hidden;text-overflow:ellipsis\">'\n      + esc(String(e.why || \"\").slice(0, 90)) + \"</td>\"\n      + \"<td><b>\" + n1(e.pts) + \"</b></td></tr>\";\n  }\n  html += \"</tbody></table></div></div></div>\";\n\n  document.getElementById(\"drawerBody\").innerHTML = html;\n  document.getElementById(\"drawer\").classList.add(\"on\");\n  document.getElementById(\"scrim\").classList.add(\"on\");\n  document.getElementById(\"drawer\").scrollTop = 0;\n  document.getElementById(\"drawerClose\").focus();\n}\nfunction closeDrawer() {\n  document.getElementById(\"drawer\").classList.remove(\"on\");\n  document.getElementById(\"scrim\").classList.remove(\"on\");\n}\n\n/* ============================================================\n   METHODOLOGY\n   ============================================================ */\nfunction methodologyHtml() {\n  const w = CFG.categoryWeights, ew = CFG.engagementSubweights,\n        cw = CFG.coverageSubweights, hw = CFG.hygieneSubweights;\n  return '<details class=\"method\"><summary>How the HubSpot AM Score is calculated</summary>'\n    + '<div class=\"method-body\">'\n    + \"<p>Each category is scored 0-100 <em>relative to the strongest performer in the \"\n    + \"current filter</em>, then weighted. Scoring the categories separately before \"\n    + \"combining them is what stops raw volume from deciding the winner: an AM who logs \"\n    + \"twice as much activity but covers half their book cannot out-score a balanced AM.</p>\"\n    + \"<h4>The formula</h4>\"\n    + \"<p><code>AM Score = \" + w.engagement + \" \u00d7 Engagement + \" + w.coverage\n    + \" \u00d7 Coverage + \" + w.hygiene + \" \u00d7 Hygiene</code></p>\"\n    + \"<h4>Client Engagement (\" + Math.round(w.engagement * 100) + \"%)</h4>\"\n    + \"<p>Points: call +\" + CFG.engagementPoints.call + \", 1:1 email +\"\n    + CFG.engagementPoints.email_1to1 + \", SMS / WhatsApp / LinkedIn message +\"\n    + (CFG.engagementPoints.message ?? 0) + \", meaningful note +\"\n    + CFG.engagementPoints.note + \". A direct message counts the same as a 1:1 \"\n    + \"email \\u2014 it is a message to one person, and the channel does not change \"\n    + \"that. HubSpot stores these on a separate object, so they were invisible to \"\n    + \"this dashboard until 12 Aug 2026.</p>\"\n    + \"<p><b>Meetings are tiered per client per calendar month</b> \u2014 the first is \"\n    + \"worth +\" + (CFG.meetingTiers || [5])[0] + \", the second +\"\n    + ((CFG.meetingTiers || [5, 2])[1] ?? 0)\n    + \", and a third or later scores nothing. Meeting a client more than twice a \"\n    + \"month is not better account management, so the score stops paying for it. \"\n    + \"The tier is counted against the calendar month no matter which date filter \"\n    + \"is selected, so a 90-day view does not squeeze an AM down to two scoring \"\n    + \"meetings for the quarter.</p>\"\n    + \"<p>Those points then combine as <code>\"\n    + ew.per_account_rate + \" \u00d7 points-per-account + \" + ew.absolute_volume\n    + \" \u00d7 total points</code>, each scaled against the leader. Rate carries most of the \"\n    + \"weight so a 12-account book can beat a 27-account book.</p>\"\n    + \"<p><b>Client satisfaction is worth +\" + (CFG.surveyPoints ?? 10)\n    + \"</b>, the single largest award in the model, because a survey score is the \"\n    + \"client's own verdict rather than something an AM can manufacture. A positive \"\n    + \"NPS (at or above \" + (CFG.surveyRules?.nps_promoter_min ?? 9) + \"/10) or CSAT \"\n    + \"(at or above \" + (CFG.surveyRules?.csat_positive_min ?? 4) + \"/\"\n    + (CFG.surveyRules?.csat_scale_max ?? 5) + \") counts once per client per calendar \"\n    + \"month \u2014 three people at one client responding well is one good outcome, not \"\n    + \"three. Detractors do <b>not</b> deduct points: that would quietly push AMs to \"\n    + \"stop sending surveys, which is the last behaviour worth discouraging. They \"\n    + \"appear in Management Alerts instead.</p>\"\n    + \"<h4>Account Coverage (\" + Math.round(w.coverage * 100) + \"%)</h4>\"\n    + \"<p><code>\" + cw.coverage_pct + \" \u00d7 Coverage% + \" + cw.management_actions\n    + \" \u00d7 management actions</code>. Coverage% is unique assigned accounts with a \"\n    + touchPhrase() + \", over total assigned accounts. Notes deliberately do \"\n    + \"not count as a touch \u2014 writing a note to yourself is not contacting a client. \"\n    + \"Management actions are completed tasks (+\" + CFG.coveragePoints.task_completed\n    + \") and account reviews (+\" + CFG.coveragePoints.account_review_completed + \"), \"\n    + \"less <b>\" + CFG.incompleteTaskPenalty + \" point for every task still open \"\n    + \"past its due date</b>. A task completed late still earns its full point \u2014 the \"\n    + \"penalty is for unfinished work, not for being slow. Each missed task is \"\n    + \"counted once and dated to the due date it blew, so it lands in that period \"\n    + \"rather than following the AM around indefinitely. A component floors at 0, \"\n    + \"so penalties cannot eat into the other two categories.</p>\"\n    + \"<h4>CRM Hygiene (\" + Math.round(w.hygiene * 100) + \"%)</h4>\"\n    + \"<p><code>\" + hw.completeness_pct + \" \u00d7 CRM Completeness% + \" + hw.hygiene_activity\n    + \" \u00d7 hygiene activity</code>. Completeness is weighted across the checks listed \"\n    + \"below and measures a real end state, so it is weighted more heavily than edit \"\n    + \"activity. Filling a blank field earns full points; changing an existing value \"\n    + \"earns half; reverting to a value the field already held earns nothing.</p>\"\n    + \"<h4>Anti-gaming rules in force</h4>\"\n    + \"<ul>\"\n    + \"<li>A third or later meeting with the same client in the same calendar month scores nothing.</li>\"\n    + \"<li>Calls under 60 seconds and meetings under 5 minutes do not score.</li>\"\n    + \"<li>Emails to more than 3 recipients are not 1:1. Inbound emails are client work, not AM work.</li>\"\n    + \"<li>Notes under 120 characters, and duplicate note bodies on the same account, do not score.</li>\"\n    + \"<li>Per company per day: 3 calls, 5 emails, 2 notes maximum.</li>\"\n    + \"<li>Each tracked field scores once per company per period, no matter how often it is edited.</li>\"\n    + \"<li>An activity logged by someone other than its owner does not score for the owner.</li>\"\n    + \"<li>A new contact must have an email and at least two populated fields.</li>\"\n    + \"</ul>\"\n    + \"<h4>CRM Completeness checks</h4>\"\n    + \"<p>Weighted per check; any check whose HubSpot property is not mapped is dropped \"\n    + \"from the denominator rather than counted as a failure, so the percentage always \"\n    + \"means \u201cof what can actually be checked\u201d.</p>\"\n    + \"<h4>Known limitations</h4>\"\n    + \"<ul>\"\n    + \"<li><b>Completeness is measured now, not as of the period end.</b> Changing the \"\n    + \"date filter changes activity and coverage, but completeness reflects the state at \"\n    + \"last sync. A historical month will show today's record quality.</li>\"\n    + \"<li><b>Scores are relative.</b> The leader in the current filter scores 100 on \"\n    + \"each component, so scores are not comparable across different filter selections. \"\n    + \"Most Improved deliberately compares each AM to their own prior period instead.</li>\"\n    + \"<li><b>Coverage depends on the active-client definition.</b> If the filter in \"\n    + \"config.py is wrong, every coverage number is wrong.</li>\"\n    + \"</ul>\"\n    + \"</div></details>\";\n}\n\n/* ============================================================\n   RENDER + WIRING\n   ============================================================ */\nconst RENDERERS = {\n  standings: renderStandings,\n  coverage: renderCoverage,\n  hygiene: renderHygiene,\n  engagement: renderEngagement,\n  alerts: renderAlerts,\n  recognition: renderRecognition,\n  annual: renderAnnual\n};\nconst TABS = [\n  [\"standings\", \"Standings\"],\n  [\"coverage\", \"Account Coverage\"],\n  [\"hygiene\", \"CRM Hygiene\"],\n  [\"engagement\", \"Engagement\"],\n  [\"alerts\", \"Management Alerts\"],\n  [\"recognition\", \"Recognition\"],\n  [\"annual\", \"Annual Race\"]\n];\n\nfunction renderMasthead() {\n  const meta = DATA.meta || {};\n  const rows = currentRows();\n  const totalAccounts = rows.reduce((s, r) => s + r.assigned, 0);\n  const el = document.getElementById(\"mastheadMeta\");\n  el.innerHTML =\n    \"<div>Account managers<b>\" + rows.length + \"</b></div>\"\n    + \"<div>Client accounts<b>\" + totalAccounts + \"</b></div>\"\n    + \"<div>Activities scored<b>\" + n0(rows.reduce((s, r) => s + r.activities, 0)) + \"</b></div>\"\n    + \"<div>Data synced<b>\" + esc((meta.synced_at || DATA.generatedAt || \"\").slice(0, 10)) + \"</b></div>\";\n  if (meta.SAMPLE_DATA) {\n    document.getElementById(\"sampleFlag\").innerHTML =\n      '<span class=\"sample-flag\">\u26a0 Sample data \u2014 not real performance</span>';\n  }\n}\n\nfunction render() {\n  for (const [key] of TABS) {\n    const panel = document.getElementById(\"p-\" + key);\n    panel.classList.toggle(\"on\", key === state.tab);\n    if (key === state.tab) panel.innerHTML = RENDERERS[key]();\n  }\n  document.querySelectorAll(\"#tabs button\").forEach(b => {\n    b.setAttribute(\"aria-selected\", String(b.dataset.tab === state.tab));\n  });\n  document.querySelectorAll(\"#periodSeg button\").forEach(b => {\n    b.setAttribute(\"aria-pressed\", String(b.dataset.period === state.period));\n  });\n  // The Annual tab is driven by the year, not the period filter.\n  const annualView = state.tab === \"annual\";\n  document.getElementById(\"customRange\")\n    .classList.toggle(\"on\", state.period === \"custom\" && !annualView);\n  document.getElementById(\"teamGroup\").hidden = !HAS_TEAMS;\n  document.getElementById(\"yearGroup\").hidden = !annualView;\n  document.getElementById(\"periodGroup\").hidden = annualView;\n  renderMasthead();\n}\n\nfunction init() {\n  // Tabs.\n  document.getElementById(\"tabs\").innerHTML = TABS.map(\n    ([k, label]) => '<button role=\"tab\" data-tab=\"' + k + '\" aria-selected=\"'\n      + (k === state.tab) + '\">' + label + \"</button>\"\n  ).join(\"\");\n\n  // Period segmented control.\n  document.getElementById(\"periodSeg\").innerHTML = PERIODS.map(\n    p => '<button type=\"button\" data-period=\"' + p.key + '\" aria-pressed=\"'\n      + (p.key === state.period) + '\">' + p.label + \"</button>\"\n  ).join(\"\");\n\n  // Team + AM selects.\n  const teams = [...new Set(AMS.map(a => a.team))].sort();\n  document.getElementById(\"teamSel\").innerHTML =\n    '<option value=\"all\">All teams</option>'\n    + teams.map(t => '<option value=\"' + esc(t) + '\">' + esc(t) + \"</option>\").join(\"\");\n  document.getElementById(\"amSel\").innerHTML =\n    '<option value=\"all\">All AMs</option>'\n    + AMS.slice().sort((a, b) => a.name.localeCompare(b.name))\n        .map(a => '<option value=\"' + esc(a.id) + '\">' + esc(a.name) + \"</option>\").join(\"\");\n\n  // Award year.\n  const years = availableYears();\n  state.year = state.year || years[0];\n  document.getElementById(\"yearSel\").innerHTML = years\n    .map(y => '<option value=\"' + y + '\">' + y + \"</option>\").join(\"\");\n  document.getElementById(\"yearSel\").value = state.year;\n  document.getElementById(\"yearSel\").addEventListener(\"change\", e => {\n    state.year = e.target.value; render();\n  });\n\n  const [f, t] = periodRange(\"last_30\");\n  document.getElementById(\"dFrom\").value = f;\n  document.getElementById(\"dTo\").value = t;\n\n  if (DATA.defaultPeriod && PERIODS.some(p => p.key === DATA.defaultPeriod)) {\n    state.period = DATA.defaultPeriod;\n  }\n\n  // Events.\n  document.getElementById(\"tabs\").addEventListener(\"click\", e => {\n    const b = e.target.closest(\"button[data-tab]\");\n    if (!b) return;\n    state.tab = b.dataset.tab;\n    render();\n  });\n  document.getElementById(\"periodSeg\").addEventListener(\"click\", e => {\n    const b = e.target.closest(\"button[data-period]\");\n    if (!b) return;\n    state.period = b.dataset.period;\n    render();\n  });\n  document.getElementById(\"dFrom\").addEventListener(\"change\", e => {\n    state.from = e.target.value; state.period = \"custom\"; render();\n  });\n  document.getElementById(\"dTo\").addEventListener(\"change\", e => {\n    state.to = e.target.value; state.period = \"custom\"; render();\n  });\n  document.getElementById(\"teamSel\").addEventListener(\"change\", e => {\n    state.team = e.target.value; render();\n  });\n  document.getElementById(\"amSel\").addEventListener(\"change\", e => {\n    state.am = e.target.value; render();\n  });\n  let qTimer;\n  document.getElementById(\"clientSearch\").addEventListener(\"input\", e => {\n    clearTimeout(qTimer);\n    const v = e.target.value;\n    qTimer = setTimeout(() => { state.q = v; render(); }, 160);\n  });\n  document.getElementById(\"resetBtn\").addEventListener(\"click\", () => {\n    state.period = \"this_month\"; state.team = \"all\"; state.am = \"all\"; state.q = \"\";\n    state.sorts = {};\n    document.getElementById(\"teamSel\").value = \"all\";\n    document.getElementById(\"amSel\").value = \"all\";\n    document.getElementById(\"clientSearch\").value = \"\";\n    render();\n  });\n  document.getElementById(\"themeBtn\").addEventListener(\"click\", () => {\n    const root = document.documentElement;\n    const current = root.getAttribute(\"data-theme\");\n    const prefersDark = window.matchMedia(\"(prefers-color-scheme: dark)\").matches;\n    const effective = current || (prefersDark ? \"dark\" : \"light\");\n    root.setAttribute(\"data-theme\", effective === \"dark\" ? \"light\" : \"dark\");\n  });\n\n  // Delegated: sortable headers, AM row clicks, podium clicks.\n  document.body.addEventListener(\"click\", e => {\n    const th = e.target.closest(\"th[data-sort]\");\n    if (th) {\n      const id = th.closest(\"table\").dataset.table;\n      const key = th.dataset.sort;\n      const cur = state.sorts[id];\n      state.sorts[id] = (cur && cur.key === key) ? { key, dir: -cur.dir } : { key, dir: -1 };\n      // A sort inside the drill-down re-renders the drawer, not the panels.\n      if (document.getElementById(\"drawer\").contains(th)) {\n        const scrollTop = document.getElementById(\"drawer\").scrollTop;\n        openDrawer(state.openAm);\n        document.getElementById(\"drawer\").scrollTop = scrollTop;\n      } else {\n        render();\n      }\n      return;\n    }\n    const amEl = e.target.closest(\"[data-am]\");\n    if (amEl && !document.getElementById(\"drawer\").contains(amEl)) {\n      openDrawer(amEl.dataset.am);\n    }\n  });\n  document.getElementById(\"drawerClose\").addEventListener(\"click\", closeDrawer);\n  document.getElementById(\"scrim\").addEventListener(\"click\", closeDrawer);\n  document.addEventListener(\"keydown\", e => { if (e.key === \"Escape\") closeDrawer(); });\n\n  render();\n}\n\ninit();\n";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById("msg");

async function unlock(passphrase) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey(
    "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt),
      iterations: PAYLOAD.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  // GCM authenticates, so a wrong passphrase throws rather than returning noise.
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function launch(data) {
  window.__AMDATA = data;
  document.getElementById("gate").remove();
  // Remove the gate stylesheet too. Its rules are scoped to #gate, but the
  // element is dead weight and any future unscoped rule would break the
  // dashboard's layout in a way that is hard to spot.
  document.getElementById("gate-style")?.remove();
  // Markup first, so the script finds the elements it expects.
  const host = document.createElement("div");
  host.innerHTML = DASHBOARD_HTML;
  while (host.firstChild) document.body.appendChild(host.firstChild);
  const s = document.createElement("script");
  s.textContent = DASHBOARD_JS;
  document.body.appendChild(s);
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value.trim();
  if (!pw) return;
  const btn = document.getElementById("go");
  btn.disabled = true;
  msg.className = "msg busy";
  msg.textContent = "Decrypting…";
  // Yield so the browser paints the message before the slow key derivation.
  await new Promise(r => setTimeout(r, 30));
  try {
    const data = await unlock(pw);
    msg.textContent = "Unlocked.";
    launch(data);
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = "That passphrase does not match. Check for typos and try again.";
    btn.disabled = false;
    document.getElementById("pw").select();
  }
});
</script>
